[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rotisserie"
version = "0.1.0.dev0"
description = "Portable graph engineering for coordinating AI and human workers"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "Josh C. L. Wren" }]
keywords = ["automation", "coordination", "graph", "workflow"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/JoshCLWren/rotisserie"
Issues = "https://github.com/JoshCLWren/rotisserie/issues"
Changelog = "https://github.com/JoshCLWren/rotisserie/blob/main/CHANGELOG.md"

[project.scripts]
rotisserie = "rotisserie.cli:main"
baste = "rotisserie.baste:main"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "ruff>=0.13,<1",
]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/factory/.github/scripts/factory_provider_registry.py",
  "/factory/.github/scripts/factory_worker_slots.py",
  "/factory/.github/scripts/factory_manual_model.py",
  "/factory/.github/scripts/factory_settings.py",
  "/factory/.github/scripts/factory_dispatch_credential_filter.py",
  "/factory/.github/scripts/factory_fleet_switch.py",
  "/factory/.github/scripts/factory_incident.py",
  "/factory/.github/scripts/factory_published_model_catalog.py",
  "/factory/.github/scripts/factory_work_policy.py",
  "/factory/.github/scripts/factory_acceptance_criteria.py",
  "/factory/.github/scripts/factory_work_policy_assignment.py",
  "/factory/.github/scripts/factory_work_policy_backlog.py",
  "/factory/.github/scripts/factory_work_policy_base.py",
  "/factory/.github/scripts/factory_work_policy_candidates.py",
  "/factory/.github/scripts/factory_issue_intake_guard.py",
  "/factory/.github/scripts/factory_work_policy_priority.py",
  "/factory/.github/scripts/factory_rotisserie_adopter.py",
  "/factory/.github/scripts/factory_review_policy.py",
  "/factory/.github/scripts/factory_self_heal_rules.py",
  "/factory/.github/scripts/factory_review_exclusion.py",
  "/factory/.github/scripts/factory_self_review_allowance.py",
  "/factory/.github/scripts/factory_label_policy.py",
  "/factory/.github/scripts/factory_adopter.py",
  "/factory/.github/scripts/factory_branch_sync.py",
  "/factory/.github/scripts/factory_main_health.py",
  "/factory/.github/scripts/factory_billing_pool.py",
  "/factory/.github/scripts/factory_turso_usage.py",
  "/factory/.github/scripts/factory_dynamic_outcome.py",
  "/factory/.github/scripts/factory_item_loop.py",
  "/factory/.github/scripts/factory_state_labels.py",
  "/factory/.github/scripts/factory_merge_linkage.py",
  "/factory/.github/scripts/factory_review_findings.py",
  "/factory/scripts/factory_eligibility.py",
  "/CHANGELOG.md",
  "/docs",
  "/examples",
  "/LICENSE",
  "/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rotisserie"]

# The operator console reads provider, worker and settings metadata from the
# same factory runtime files the dispatcher uses; ship them inside the wheel.
[tool.hatch.build.targets.wheel.force-include]
"factory/.github/scripts/factory_provider_registry.py" = "rotisserie/factory_console/factory_runtime/factory_provider_registry.py"
"factory/.github/scripts/factory_worker_slots.py" = "rotisserie/factory_console/factory_runtime/factory_worker_slots.py"
"factory/.github/scripts/factory_manual_model.py" = "rotisserie/factory_console/factory_runtime/factory_manual_model.py"
"factory/.github/scripts/factory_settings.py" = "rotisserie/factory_console/factory_runtime/factory_settings.py"
"factory/.github/scripts/factory_dispatch_credential_filter.py" = "rotisserie/factory_console/factory_runtime/factory_dispatch_credential_filter.py"
"factory/.github/scripts/factory_fleet_switch.py" = "rotisserie/factory_console/factory_runtime/factory_fleet_switch.py"
"factory/.github/scripts/factory_incident.py" = "rotisserie/factory_console/factory_runtime/factory_incident.py"
"factory/.github/scripts/factory_published_model_catalog.py" = "rotisserie/factory_console/factory_runtime/factory_published_model_catalog.py"
"factory/.github/scripts/factory_work_policy.py" = "rotisserie/factory_console/factory_runtime/factory_work_policy.py"
"factory/.github/scripts/factory_acceptance_criteria.py" = "rotisserie/factory_console/factory_runtime/factory_acceptance_criteria.py"
"factory/.github/scripts/factory_work_policy_assignment.py" = "rotisserie/factory_console/factory_runtime/factory_work_policy_assignment.py"
"factory/.github/scripts/factory_work_policy_backlog.py" = "rotisserie/factory_console/factory_runtime/factory_work_policy_backlog.py"
"factory/.github/scripts/factory_work_policy_base.py" = "rotisserie/factory_console/factory_runtime/factory_work_policy_base.py"
"factory/.github/scripts/factory_work_policy_candidates.py" = "rotisserie/factory_console/factory_runtime/factory_work_policy_candidates.py"
"factory/.github/scripts/factory_issue_intake_guard.py" = "rotisserie/factory_console/factory_runtime/factory_issue_intake_guard.py"
"factory/.github/scripts/factory_work_policy_priority.py" = "rotisserie/factory_console/factory_runtime/factory_work_policy_priority.py"
"factory/.github/scripts/factory_rotisserie_adopter.py" = "rotisserie/factory_console/factory_runtime/factory_rotisserie_adopter.py"
"factory/.github/scripts/factory_review_policy.py" = "rotisserie/factory_console/factory_runtime/factory_review_policy.py"
"factory/.github/scripts/factory_self_heal_rules.py" = "rotisserie/factory_console/factory_runtime/factory_self_heal_rules.py"
"factory/.github/scripts/factory_review_exclusion.py" = "rotisserie/factory_console/factory_runtime/factory_review_exclusion.py"
"factory/.github/scripts/factory_self_review_allowance.py" = "rotisserie/factory_console/factory_runtime/factory_self_review_allowance.py"
"factory/.github/scripts/factory_label_policy.py" = "rotisserie/factory_console/factory_runtime/factory_label_policy.py"
"factory/.github/scripts/factory_adopter.py" = "rotisserie/factory_console/factory_runtime/factory_adopter.py"
"factory/.github/scripts/factory_branch_sync.py" = "rotisserie/factory_console/factory_runtime/factory_branch_sync.py"
"factory/.github/scripts/factory_main_health.py" = "rotisserie/factory_console/factory_runtime/factory_main_health.py"
"factory/.github/scripts/factory_billing_pool.py" = "rotisserie/factory_console/factory_runtime/factory_billing_pool.py"
"factory/.github/scripts/factory_turso_usage.py" = "rotisserie/factory_console/factory_runtime/factory_turso_usage.py"
"factory/.github/scripts/factory_dynamic_outcome.py" = "rotisserie/factory_console/factory_runtime/factory_dynamic_outcome.py"
"factory/.github/scripts/factory_item_loop.py" = "rotisserie/factory_console/factory_runtime/factory_item_loop.py"
"factory/.github/scripts/factory_state_labels.py" = "rotisserie/factory_console/factory_runtime/factory_state_labels.py"
"factory/.github/scripts/factory_merge_linkage.py" = "rotisserie/factory_console/factory_runtime/factory_merge_linkage.py"
"factory/.github/scripts/factory_review_findings.py" = "rotisserie/factory_console/factory_runtime/factory_review_findings.py"
"factory/scripts/factory_eligibility.py" = "rotisserie/factory_console/factory_runtime/factory_eligibility.py"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["prototype", "tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["factory", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Verbatim GitHub log lines and dispatcher JSON are fixtures; do not wrap them.
"tests/test_factory_console.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
mypy_path = "src"
files = ["src/rotisserie", "prototype", "tests"]
exclude = ["^factory/"]
