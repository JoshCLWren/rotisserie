# Explicit, maintainer-triggered reconciliation of exact-head provenance for an
# owner-authored factory PR whose head was advanced outside the numbered-worker
# wrapper (a local merge or rebase, or trusted repository automation).
#
# Without this step such a head can never satisfy the exact-head cross-model
# gate, so the review controller parks it in `factory:blocked` forever. The
# controller only attests an identity GitHub already attributes to the owner or
# to trusted automation, and it never invents a numbered-worker identity.
name: Factory Provenance Reconcile
on:
  workflow_call:
    inputs:
      pr:
        type: string
        required: false
      head:
        type: string
        required: false

env:
  # Operator settings (rotisserie factory settings) reach every factory script.
  FACTORY_REPO_VARS: >-
    {"FACTORY_SLOTS_PER_PROVIDER": "${{ vars.FACTORY_SLOTS_PER_PROVIDER }}", "FACTORY_PR_WIP_LIMIT": "${{ vars.FACTORY_PR_WIP_LIMIT }}", "FACTORY_REVIEW_BACKLOG_LIMIT": "${{ vars.FACTORY_REVIEW_BACKLOG_LIMIT }}", "FACTORY_OMNIROUTE_FREE_ENTRY_CAP": "${{ vars.FACTORY_OMNIROUTE_FREE_ENTRY_CAP }}", "FACTORY_NO_DIFF_RETRY_LIMIT": "${{ vars.FACTORY_NO_DIFF_RETRY_LIMIT }}", "FACTORY_NO_DIFF_RETRY_RESET_SECONDS": "${{ vars.FACTORY_NO_DIFF_RETRY_RESET_SECONDS }}", "FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS": "${{ vars.FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS }}", "FACTORY_FIXED_LEASE_TTL_SECONDS": "${{ vars.FACTORY_FIXED_LEASE_TTL_SECONDS }}", "FACTORY_LOCAL_LEASE_TTL_SECONDS": "${{ vars.FACTORY_LOCAL_LEASE_TTL_SECONDS }}", "FACTORY_PRIORITY_ORDER": "${{ vars.FACTORY_PRIORITY_ORDER }}", "FACTORY_DISABLED_PROVIDERS": "${{ vars.FACTORY_DISABLED_PROVIDERS }}", "FACTORY_DISABLED_MODELS": "${{ vars.FACTORY_DISABLED_MODELS }}"}

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Set up factory Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Check out Rotisserie factory runtime
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .rotisserie/runtime
          persist-credentials: false
      - name: Overlay Rotisserie factory runtime
        run: bash .rotisserie/runtime/factory/install/overlay.sh .

      - name: Install factory syntax parsers
        uses: ./.github/actions/factory-syntax

      - name: Reconcile exact-head provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          pr="${{ inputs.pr }}"
          head="${{ inputs.head }}"
          [[ "$pr" =~ ^[0-9]+$ ]] || { echo "invalid pr"; exit 1; }
          args=(reconcile-provenance --pr "$pr")
          if [[ -n "$head" ]]; then
            args+=(--head "$head")
          fi
          python3 .github/scripts/factory-review-controller.py "${args[@]}"
          gh pr view "$pr" --json headRefOid,labels \
            --jq '{head: .headRefOid, labels: [.labels[].name]}'
