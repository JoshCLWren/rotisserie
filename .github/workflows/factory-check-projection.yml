# CI/review results wake the exact PR. GitHub remains authoritative at
# assignment and merge boundaries; routine checks never write Neon projections.
name: Factory Check Completion Wakeup
on:
  workflow_call:
    secrets:
      NEON_API_KEY:
        required: false

env:
  # Operator settings (rotisserie factory settings) reach every factory script.
  FACTORY_REPO_VARS: >-
    {"FACTORY_SLOTS_PER_PROVIDER": "${{ vars.FACTORY_SLOTS_PER_PROVIDER }}", "FACTORY_PR_WIP_LIMIT": "${{ vars.FACTORY_PR_WIP_LIMIT }}", "FACTORY_REVIEW_BACKLOG_LIMIT": "${{ vars.FACTORY_REVIEW_BACKLOG_LIMIT }}", "FACTORY_OMNIROUTE_FREE_ENTRY_CAP": "${{ vars.FACTORY_OMNIROUTE_FREE_ENTRY_CAP }}", "FACTORY_NO_DIFF_RETRY_LIMIT": "${{ vars.FACTORY_NO_DIFF_RETRY_LIMIT }}", "FACTORY_NO_DIFF_RETRY_RESET_SECONDS": "${{ vars.FACTORY_NO_DIFF_RETRY_RESET_SECONDS }}", "FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS": "${{ vars.FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS }}", "FACTORY_FIXED_LEASE_TTL_SECONDS": "${{ vars.FACTORY_FIXED_LEASE_TTL_SECONDS }}", "FACTORY_LOCAL_LEASE_TTL_SECONDS": "${{ vars.FACTORY_LOCAL_LEASE_TTL_SECONDS }}", "FACTORY_PRIORITY_ORDER": "${{ vars.FACTORY_PRIORITY_ORDER }}", "FACTORY_DISABLED_PROVIDERS": "${{ vars.FACTORY_DISABLED_PROVIDERS }}", "FACTORY_DISABLED_MODELS": "${{ vars.FACTORY_DISABLED_MODELS }}", "FACTORY_INCIDENTS": "${{ vars.FACTORY_INCIDENTS }}"}

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  wake:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 4
    concurrency:
      group: factory-check-wakeup-${{ github.event.workflow_run.pull_requests[0].number }}
      queue: single
      cancel-in-progress: false
    env:
      REVIEW_FAILURE: ${{ (github.event.workflow_run.name == 'PR-Agent Advisory Review' || github.event.workflow_run.name == 'Local Ollama Review') && github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Set up factory Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Checkout trusted controller for failed-review cooldown only
        if: env.REVIEW_FAILURE == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Check out Rotisserie factory runtime
        if: env.REVIEW_FAILURE == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .rotisserie/runtime
          persist-credentials: false
      - name: Overlay Rotisserie factory runtime
        if: env.REVIEW_FAILURE == 'true'
        run: bash .rotisserie/runtime/factory/install/overlay.sh .

      - name: Configure restricted Neon for failed-review cooldown only
        if: env.REVIEW_FAILURE == 'true'
        uses: ./.github/actions/factory-state-cache
        with:
          neon-api-key: ${{ secrets.NEON_API_KEY }}
          neon-project-id: ${{ vars.NEON_PROJECT_ID }}

      - name: Persist exact-head review transport failure
        if: env.REVIEW_FAILURE == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${FACTORY_STATE_DSN_FILE:-}" || ! -s "$FACTORY_STATE_DSN_FILE" ]]; then
            echo "::error::Review failure cooldown requires a valid restricted Neon connection"
            exit 1
          fi
          python3 .github/scripts/factory_state_operations.py ingest-check \
            --repo "$GITHUB_REPOSITORY" --file "$GITHUB_EVENT_PATH"

      - name: Wake exact-head PR on check/review completion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          sha="$(jq -r '.workflow_run.head_sha // empty' "$GITHUB_EVENT_PATH")"
          if [[ ! "$sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Completed check has no trustworthy head SHA"
            exit 1
          fi
          jq -r '.workflow_run.pull_requests[]?.number | select(type == "number" and . > 0)' "$GITHUB_EVENT_PATH" \
            | sort -nu | head -10 | while read -r pr; do
            current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")"
            if ! jq -e --arg sha "$sha" '
              .state == "open" and .draft == false and .base.ref == "main"
              and .head.sha == $sha
            ' <<< "$current" >/dev/null; then
              echo "Check is stale or PR is no longer eligible: #${pr}"
              continue
            fi
            # A live worker lease already owns the next action; its own
            # handoff (and a later check completion) wakes the PR. Every
            # dispatcher pass costs hundreds of shared installation requests.
            if jq -e '[.labels[].name | select(test("^factory:([0-9]+|local)$"))] | length > 0' \
              <<< "$current" >/dev/null; then
              echo "PR #${pr} is leased by an active worker; no wakeup"
              continue
            fi
            # Several workflows complete per head (CI, guards, review). Wake
            # once, when the last check run on this exact head has finished.
            pending="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.status != "completed")] | length')"
            if [[ "$pending" != 0 ]]; then
              echo "PR #${pr} still has ${pending} running check(s) on ${sha}; the last completion wakes it"
              continue
            fi
            gh workflow run fixed-model-factory-dispatch.yml \
              --repo "$GITHUB_REPOSITORY" --ref main -f "target=pr:${pr}" -f mode=roster
            echo "Queued targeted factory check wakeup for PR #${pr}"
          done
