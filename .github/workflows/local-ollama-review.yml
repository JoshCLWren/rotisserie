# Trusted bridge: GitHub Actions attests (standard factory scheme). Inference
# can be any OpenAI-compatible provider (Ollama local, Josh's ChatGPT, etc.)
# via REVIEW_PROVIDER_URL/KEY/MODEL secrets. Trust = Josh's login credential
# (OWNER) + github-actions[bot] attestor; external/fork comments are treated
# as untrusted data and never drive the queue. No PR head checkout.
# A single 4-GB GPU serves both manual and fleet-triggered reviews.
name: Local Ollama Review
on:
  workflow_call:
    inputs:
      pr:
        type: string
        required: false
    secrets:
      LOCAL_OLLAMA_KEY:
        required: false
      LOCAL_OLLAMA_URL:
        required: false
      REVIEW_PROVIDER_KEY:
        required: false
      REVIEW_PROVIDER_URL:
        required: false

env:
  # Operator settings (rotisserie factory settings) reach every factory script.
  FACTORY_REPO_VARS: >-
    {"FACTORY_SLOTS_PER_PROVIDER": "${{ vars.FACTORY_SLOTS_PER_PROVIDER }}", "FACTORY_PR_WIP_LIMIT": "${{ vars.FACTORY_PR_WIP_LIMIT }}", "FACTORY_REVIEW_BACKLOG_LIMIT": "${{ vars.FACTORY_REVIEW_BACKLOG_LIMIT }}", "FACTORY_OMNIROUTE_FREE_ENTRY_CAP": "${{ vars.FACTORY_OMNIROUTE_FREE_ENTRY_CAP }}", "FACTORY_NO_DIFF_RETRY_LIMIT": "${{ vars.FACTORY_NO_DIFF_RETRY_LIMIT }}", "FACTORY_NO_DIFF_RETRY_RESET_SECONDS": "${{ vars.FACTORY_NO_DIFF_RETRY_RESET_SECONDS }}", "FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS": "${{ vars.FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS }}", "FACTORY_FIXED_LEASE_TTL_SECONDS": "${{ vars.FACTORY_FIXED_LEASE_TTL_SECONDS }}", "FACTORY_LOCAL_LEASE_TTL_SECONDS": "${{ vars.FACTORY_LOCAL_LEASE_TTL_SECONDS }}", "FACTORY_PRIORITY_ORDER": "${{ vars.FACTORY_PRIORITY_ORDER }}", "FACTORY_DISABLED_PROVIDERS": "${{ vars.FACTORY_DISABLED_PROVIDERS }}", "FACTORY_DISABLED_MODELS": "${{ vars.FACTORY_DISABLED_MODELS }}"}

permissions:
  actions: write # Dispatch the existing canonical ready-merge drain on trusted readiness.
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    # Three hours is deliberately generous while measuring slow on-device inference.
    timeout-minutes: 180
    steps:
      - name: Set up factory Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Check out Rotisserie factory runtime
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .rotisserie/runtime
          persist-credentials: false
      - name: Overlay Rotisserie factory runtime
        run: bash .rotisserie/runtime/factory/install/overlay.sh .
      # Every trigger obeys the fleet switch: rotisserie factory providers disable local-ollama.
      - name: Check the local-ollama fleet switch
        id: switch
        run: |
          if python3 .github/scripts/factory_fleet_switch.py check local-ollama; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::local-ollama is turned off; no review runs"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run provider-backed controller review (standard scheme)
        if: steps.switch.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_PROVIDER_URL: ${{ secrets.REVIEW_PROVIDER_URL || secrets.LOCAL_OLLAMA_URL }}
          REVIEW_PROVIDER_KEY: ${{ secrets.REVIEW_PROVIDER_KEY || secrets.LOCAL_OLLAMA_KEY }}
          REVIEW_PROVIDER_MODEL: ${{ vars.REVIEW_PROVIDER_MODEL || 'qwen2.5-coder:7b' }}
          PR_INPUT: ${{ inputs.pr }}
          PR_PAYLOAD: ${{ github.event.client_payload.pr }}
        run: bash .github/scripts/local-ollama-review.sh
