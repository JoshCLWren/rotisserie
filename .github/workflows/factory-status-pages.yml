name: Factory Status Pages

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/generate_factory_status_dashboard.py'
      - '.github/scripts/probe_opencode_free_roster.py'
      - '.github/scripts/factory_capacity_policy.py'
      - '.github/scripts/factory_full_completion_controller.py'
      - '.github/scripts/factory_completion_controller.py'
      - '.github/workflows/factory-status-pages.yml'
      - '.github/free-model-factories.tsv'

permissions:
  contents: write
  issues: read
  pull-requests: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: factory-status-pages
  cancel-in-progress: false

jobs:
  publish-live-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Generate factory dashboard
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: .github/scripts
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_MANAGEMENT_API_KEY: ${{ secrets.OMNIROUTE_MANAGEMENT_API_KEY }}
          OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL }}
        run: python3 .github/scripts/generate_factory_status_dashboard.py

      - name: Publish live dashboard snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='factory-status-live'
          main_sha="$(git rev-parse HEAD)"

          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/heads/${branch}" \
              -f "sha=${main_sha}" >/dev/null
          fi

          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/index.html?ref=${branch}" \
            --jq '.sha' 2>/dev/null || true)"
          content="$(base64 -w0 site/index.html)"
          args=(
            --method PUT
            "repos/${GITHUB_REPOSITORY}/contents/index.html"
            -f "branch=${branch}"
            -f 'message=chore: refresh factory dashboard'
            -f "content=${content}"
          )
          if [[ -n "$existing_sha" ]]; then
            args+=(-f "sha=${existing_sha}")
          fi
          gh api "${args[@]}" --jq '.commit.sha'

  build-pages-shell:
    if: github.event_name == 'push'
    needs: publish-live-dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Build live dashboard shell
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1">
              <title>ComicPile Factory</title>
              <style>
                body { font: 16px system-ui, sans-serif; margin: 0; background: #0b1020; color: #eef2ff; }
                main { min-height: 100vh; display: grid; place-items: center; padding: 2rem; text-align: center; }
                code { color: #a5b4fc; }
              </style>
            </head>
            <body>
              <main id="status">Loading the live factory dashboard…</main>
              <script>
                (() => {
                  const source = 'https://raw.githubusercontent.com/JoshCLWren/comic-pile/factory-status-live/index.html';
                  const status = document.querySelector('#status');
                  const load = async () => {
                    try {
                      const response = await fetch(`${source}?v=${Date.now()}`, { cache: 'no-store' });
                      if (!response.ok) throw new Error(`live snapshot returned ${response.status}`);
                      const html = await response.text();
                      const marker = 'Can the fleet move work, and which factories are actually useful?';
                      if (!html.includes(marker)) throw new Error('live snapshot is not the factory dashboard');
                      const refreshingHtml = html.replace(
                        '</head>',
                        '<meta http-equiv="refresh" content="60"></head>',
                      );
                      document.open();
                      document.write(refreshingHtml);
                      document.close();
                    } catch (error) {
                      status.textContent = `Could not load the live dashboard: ${error}. Retrying…`;
                      setTimeout(load, 15000);
                    }
                  };
                  load();
                })();
              </script>
            </body>
          </html>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Verify Pages publishing mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config="$(gh api "repos/${GITHUB_REPOSITORY}/pages")"
          echo "Pages configuration: $(jq -c '{build_type,status,html_url,source}' <<<"$config")"
          build_type="$(jq -r '.build_type // "unknown"' <<<"$config")"
          if [[ "$build_type" != "workflow" ]]; then
            echo "::error::GitHub Pages build_type is '$build_type'; expected 'workflow'. Set Settings > Pages > Source to GitHub Actions."
            exit 1
          fi

      - name: Upload dashboard shell
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-pages-shell
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify public shell and live snapshot
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          page_url="${PAGE_URL%/}/?factory-pages-check=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          live_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/factory-status-live/index.html?factory-live-check=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          marker='Can the fleet move work, and which factories are actually useful?'
          loader='factory-status-live/index.html'

          for attempt in {1..18}; do
            shell="$(curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$page_url" 2>/dev/null || true)"
            live="$(curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$live_url" 2>/dev/null || true)"
            generated="$(grep -oE 'Generated [0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z' <<<"$live" \
              | head -n 1 | cut -d' ' -f2)"

            if grep -Fq "$loader" <<<"$shell" \
              && grep -Fq "$marker" <<<"$live" \
              && [[ -n "$generated" ]] \
              && python3 - "$generated" <<'PY'
          from datetime import datetime, timezone
          import sys

          generated = datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
          age = (datetime.now(timezone.utc) - generated).total_seconds()
          raise SystemExit(0 if -60 <= age <= 1800 else 1)
          PY
            then
              echo "Verified Pages shell at $PAGE_URL with live snapshot generated $generated."
              exit 0
            fi
            sleep 10
          done

          echo "::error::Pages is not serving the live dashboard shell or the live snapshot is stale."
          exit 1
