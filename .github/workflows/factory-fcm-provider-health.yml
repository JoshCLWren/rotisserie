# Manual-only diagnostic. No worker claims, issue edits, PRs, or provider roster.
name: Factory FCM Provider Credential Health
on:
  workflow_call:
    inputs:
      scope:
        type: string
        required: false
    secrets:
      AI_GATEWAY_API_KEY:
        required: false
      CEREBRAS_API_KEY:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      GEMINI_API_KEY:
        required: false
      GROQ_API_KEY:
        required: false
      MISTRAL_API_KEY:
        required: false
      NVIDIA_API_KEY:
        required: false
      OLLAMA_API_KEY:
        required: false
      OPENCODE_ZEN_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      ORCAROUTER_API_KEY:
        required: false
      REQUESTY_API_KEY:
        required: false
      ROUTEWAY_API_KEY:
        required: false
      SAMBANOVA_API_KEY:
        required: false
      SAMBA_NOVA_API_KEY:
        required: false
      SCALEWAY_API_KEY:
        required: false
      SILICONFLOW_API_KEY:
        required: false

env:
  # Operator settings (rotisserie factory settings) reach every factory script.
  FACTORY_REPO_VARS: >-
    {"FACTORY_SLOTS_PER_PROVIDER": "${{ vars.FACTORY_SLOTS_PER_PROVIDER }}", "FACTORY_PR_WIP_LIMIT": "${{ vars.FACTORY_PR_WIP_LIMIT }}", "FACTORY_REVIEW_BACKLOG_LIMIT": "${{ vars.FACTORY_REVIEW_BACKLOG_LIMIT }}", "FACTORY_OMNIROUTE_FREE_ENTRY_CAP": "${{ vars.FACTORY_OMNIROUTE_FREE_ENTRY_CAP }}", "FACTORY_NO_DIFF_RETRY_LIMIT": "${{ vars.FACTORY_NO_DIFF_RETRY_LIMIT }}", "FACTORY_NO_DIFF_RETRY_RESET_SECONDS": "${{ vars.FACTORY_NO_DIFF_RETRY_RESET_SECONDS }}", "FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS": "${{ vars.FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS }}", "FACTORY_FIXED_LEASE_TTL_SECONDS": "${{ vars.FACTORY_FIXED_LEASE_TTL_SECONDS }}", "FACTORY_LOCAL_LEASE_TTL_SECONDS": "${{ vars.FACTORY_LOCAL_LEASE_TTL_SECONDS }}", "FACTORY_PRIORITY_ORDER": "${{ vars.FACTORY_PRIORITY_ORDER }}", "FACTORY_DISABLED_PROVIDERS": "${{ vars.FACTORY_DISABLED_PROVIDERS }}", "FACTORY_DISABLED_MODELS": "${{ vars.FACTORY_DISABLED_MODELS }}"}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Set up factory Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out Rotisserie factory runtime
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .rotisserie/runtime
          persist-credentials: false
      - name: Overlay Rotisserie factory runtime
        run: bash .rotisserie/runtime/factory/install/overlay.sh .
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install inspected FCM package
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/factory-fcm-provider-health.cjs
          npm install --prefix "$RUNNER_TEMP/fcm" --no-save --ignore-scripts --no-audit --no-fund free-coding-models@0.6.1
      - name: Probe configured providers using FCM
        shell: bash
        env:
          FCM_PACKAGE_DIR: ${{ runner.temp }}/fcm/node_modules/free-coding-models
          FCM_PROBE_SCOPE: ${{ inputs.scope }}
          FCM_REPORT_PATH: ${{ runner.temp }}/fcm-provider-report.json
          FREE_CODING_MODELS_TELEMETRY: '0'
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          ROUTEWAY_API_KEY: ${{ secrets.ROUTEWAY_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBA_NOVA_API_KEY || secrets.SAMBANOVA_API_KEY }}
          SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: node .github/scripts/factory-fcm-provider-health.cjs
      - name: Upload credential diagnostic report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fcm-provider-health
          path: ${{ runner.temp }}/fcm-provider-report.json
          if-no-files-found: warn
          retention-days: 7
