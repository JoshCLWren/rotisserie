# Installed by factory/install/install.py in an adopter repository.
# Runs the libSQL store test matrix against the adopter's hosted database in a
# throwaway namespace, deletes that namespace and publishes a JSON summary.
# The URL and token reach only this job, through a masked file and variable.
name: Factory Turso Self-Test
on:
  workflow_call:
    inputs:
      measure:
        type: boolean
        required: false
    secrets:
      FACTORY_TURSO_URL:
        required: false
      FACTORY_TURSO_TOKEN:
        required: false

env:
  # Operator settings (rotisserie factory settings) reach every factory script.
  FACTORY_REPO_VARS: >-
    {"FACTORY_SLOTS_PER_PROVIDER": "${{ vars.FACTORY_SLOTS_PER_PROVIDER }}", "FACTORY_PR_WIP_LIMIT": "${{ vars.FACTORY_PR_WIP_LIMIT }}", "FACTORY_REVIEW_BACKLOG_LIMIT": "${{ vars.FACTORY_REVIEW_BACKLOG_LIMIT }}", "FACTORY_OMNIROUTE_FREE_ENTRY_CAP": "${{ vars.FACTORY_OMNIROUTE_FREE_ENTRY_CAP }}", "FACTORY_NO_DIFF_RETRY_LIMIT": "${{ vars.FACTORY_NO_DIFF_RETRY_LIMIT }}", "FACTORY_NO_DIFF_RETRY_RESET_SECONDS": "${{ vars.FACTORY_NO_DIFF_RETRY_RESET_SECONDS }}", "FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS": "${{ vars.FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS }}", "FACTORY_FIXED_LEASE_TTL_SECONDS": "${{ vars.FACTORY_FIXED_LEASE_TTL_SECONDS }}", "FACTORY_LOCAL_LEASE_TTL_SECONDS": "${{ vars.FACTORY_LOCAL_LEASE_TTL_SECONDS }}", "FACTORY_PRIORITY_ORDER": "${{ vars.FACTORY_PRIORITY_ORDER }}", "FACTORY_DISABLED_PROVIDERS": "${{ vars.FACTORY_DISABLED_PROVIDERS }}", "FACTORY_DISABLED_MODELS": "${{ vars.FACTORY_DISABLED_MODELS }}", "FACTORY_INCIDENTS": "${{ vars.FACTORY_INCIDENTS }}"}

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Rotisserie factory runtime
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .rotisserie/runtime
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
      - name: Give this job the store connection
        shell: bash
        env:
          TURSO_URL: ${{ secrets.FACTORY_TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.FACTORY_TURSO_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$TURSO_URL" || -z "$TURSO_TOKEN" ]]; then
            echo "::error::The FACTORY_TURSO_URL and FACTORY_TURSO_TOKEN secrets are required"
            exit 1
          fi
          echo "::add-mask::$TURSO_URL"
          echo "::add-mask::$TURSO_TOKEN"
          umask 077
          printf '%s' "$TURSO_TOKEN" > "$RUNNER_TEMP/factory-store-token"
          echo "FACTORY_TEST_LIBSQL_URL=$TURSO_URL" >> "$GITHUB_ENV"
          echo "FACTORY_TEST_LIBSQL_TOKEN_FILE=$RUNNER_TEMP/factory-store-token" >> "$GITHUB_ENV"
      - name: Run the store test matrix in a throwaway namespace
        shell: bash
        working-directory: .rotisserie/runtime/factory
        env:
          MEASURE: ${{ inputs.measure }}
        run: |
          set -Eeuo pipefail
          args=(--namespace "selftest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                --out "$RUNNER_TEMP/factory-turso-selftest.json")
          if [[ "$MEASURE" == "true" ]]; then
            args+=(--measure)
          fi
          status=0
          uv run --locked --python 3.14 python .github/scripts/factory_turso_selftest.py \
            "${args[@]}" || status=$?
          python3 - "$RUNNER_TEMP/factory-turso-selftest.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          found = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          usage = found.get("usage") or {}
          lines = [
              f"# Factory store self-test: {found['status']}",
              "",
              f"Passed {found['passed']}, failed {found['failed']}, skipped {found['skipped']}.",
              f"Rows read {usage.get('rows_read', 0)}, rows written {usage.get('rows_written', 0)}"
              " (test process only).",
          ]
          monthly = (found.get("measurement") or {}).get("monthly")
          if monthly:
              lines.append(f"Projected month: {monthly}")
          Path(sys.argv[2]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          exit "$status"
      - name: Remove the token file
        if: always()
        run: rm -f "$RUNNER_TEMP/factory-store-token"
      - name: Publish the self-test summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: factory-turso-selftest-${{ github.run_id }}
          path: ${{ runner.temp }}/factory-turso-selftest.json
          retention-days: 7
          if-no-files-found: error
