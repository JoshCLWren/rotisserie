# Installed by factory/install/install.py in an adopter repository.
# Copies the factory's Neon state into the libSQL (Turso) store, or with
# dry_run (the default) only reads Neon and reports what it would copy.
# Neon is read inside one read-only snapshot. Both credentials reach only this
# job, through masked 0600 files that a final step removes. The published
# summary holds counts and category names only, never row content.
name: Factory Store Migrate
on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        required: false
        default: true
    secrets:
      NEON_API_KEY:
        required: false
      FACTORY_TURSO_URL:
        required: false
      FACTORY_TURSO_TOKEN:
        required: false

env:
  # Operator settings (rotisserie factory settings) reach every factory script.
  FACTORY_REPO_VARS: >-
    {"FACTORY_SLOTS_PER_PROVIDER": "${{ vars.FACTORY_SLOTS_PER_PROVIDER }}", "FACTORY_PR_WIP_LIMIT": "${{ vars.FACTORY_PR_WIP_LIMIT }}", "FACTORY_REVIEW_BACKLOG_LIMIT": "${{ vars.FACTORY_REVIEW_BACKLOG_LIMIT }}", "FACTORY_OMNIROUTE_FREE_ENTRY_CAP": "${{ vars.FACTORY_OMNIROUTE_FREE_ENTRY_CAP }}", "FACTORY_NO_DIFF_RETRY_LIMIT": "${{ vars.FACTORY_NO_DIFF_RETRY_LIMIT }}", "FACTORY_NO_DIFF_RETRY_RESET_SECONDS": "${{ vars.FACTORY_NO_DIFF_RETRY_RESET_SECONDS }}", "FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS": "${{ vars.FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS }}", "FACTORY_FIXED_LEASE_TTL_SECONDS": "${{ vars.FACTORY_FIXED_LEASE_TTL_SECONDS }}", "FACTORY_LOCAL_LEASE_TTL_SECONDS": "${{ vars.FACTORY_LOCAL_LEASE_TTL_SECONDS }}", "FACTORY_PRIORITY_ORDER": "${{ vars.FACTORY_PRIORITY_ORDER }}", "FACTORY_DISABLED_PROVIDERS": "${{ vars.FACTORY_DISABLED_PROVIDERS }}", "FACTORY_DISABLED_MODELS": "${{ vars.FACTORY_DISABLED_MODELS }}", "FACTORY_INCIDENTS": "${{ vars.FACTORY_INCIDENTS }}"}

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    concurrency:
      group: factory-store-migrate-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - name: Check out Rotisserie factory runtime
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .rotisserie/runtime
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Give this job the Neon and store connections
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          TURSO_URL: ${{ secrets.FACTORY_TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.FACTORY_TURSO_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$NEON_API_KEY" || -z "$NEON_PROJECT_ID" ]]; then
            echo "::error::The NEON_API_KEY secret and NEON_PROJECT_ID variable are required"
            exit 1
          fi
          if [[ -z "$TURSO_URL" || -z "$TURSO_TOKEN" ]]; then
            echo "::error::The FACTORY_TURSO_URL and FACTORY_TURSO_TOKEN secrets are required"
            exit 1
          fi
          echo "::add-mask::$TURSO_URL"
          echo "::add-mask::$TURSO_TOKEN"
          endpoint="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?database_name=factory_state&role_name=factory_state_rw"
          if ! response="$(curl --fail --silent --show-error --max-time 15 \
            --url "$endpoint" \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${NEON_API_KEY}")"; then
            echo "::error::Unable to resolve the Neon factory_state connection"
            exit 1
          fi
          if ! uri="$(jq -er '.uri | select(type == "string" and length > 0)' <<< "$response")"; then
            echo "::error::Neon did not return a factory_state connection"
            exit 1
          fi
          echo "::add-mask::$uri"
          umask 077
          printf '%s' "$uri" > "$RUNNER_TEMP/factory-neon-connection"
          printf '%s' "$TURSO_TOKEN" > "$RUNNER_TEMP/factory-store-token"
          chmod 600 "$RUNNER_TEMP/factory-neon-connection" "$RUNNER_TEMP/factory-store-token"
          echo "FACTORY_STATE_DSN_FILE=$RUNNER_TEMP/factory-neon-connection" >> "$GITHUB_ENV"
          echo "FACTORY_TURSO_URL=$TURSO_URL" >> "$GITHUB_ENV"
          echo "FACTORY_TURSO_TOKEN_FILE=$RUNNER_TEMP/factory-store-token" >> "$GITHUB_ENV"
      - name: Migrate the factory state
        shell: bash
        working-directory: .rotisserie/runtime/factory
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -Eeuo pipefail
          python -m pip install --quiet 'asyncpg>=0.30,<1'
          args=(--repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/factory-store-migrate.json")
          if [[ "$DRY_RUN" != "false" ]]; then
            args+=(--dry-run)
          fi
          status=0
          python .github/scripts/factory_turso_migrate.py "${args[@]}" || status=$?
          python3 - "$RUNNER_TEMP/factory-store-migrate.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          found = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          mode = "dry run" if found.get("dry_run") else "migration"
          lines = [f"# Factory store {mode}: {found['status']}", ""]
          if found.get("error"):
              lines.append(f"Error: {found['error']}")
          checks = found.get("checks") or {}
          if checks:
              lines.append(f"Projection keys in Neon: {checks.get('projection_keys', 0)}")
              for item in checks.get("provider_budget_set", []):
                  lines.append(f"Budget row {item['source']}: {', '.join(item['columns'])}")
              lines.append("")
          for table, count in sorted((found.get("neon_tables") or {}).items()):
              lines.append(f"- Neon {table}: {count} rows")
          for table in found.get("absent_tables") or []:
              lines.append(f"- Neon {table}: absent")
          lines.append("")
          lines.append("| Group | Source | Eligible | Inserted | Present | Skipped |")
          lines.append("| --- | --- | --- | --- | --- | --- |")
          for name, group in sorted((found.get("migration") or {}).items()):
              skipped = ", ".join(f"{k} {v}" for k, v in sorted(group["skipped"].items()))
              lines.append(
                  f"| {name} | {group['source']} | {group['eligible']} | {group['inserted']}"
                  f" | {group['present']} | {skipped} |"
              )
          for item in found.get("mismatches") or []:
              lines.append(f"Mismatch: {item}")
          Path(sys.argv[2]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          exit "$status"
      - name: Remove the credential files
        if: always()
        run: rm -f "$RUNNER_TEMP/factory-neon-connection" "$RUNNER_TEMP/factory-store-token"
      - name: Publish the migration summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: factory-store-migrate-${{ github.run_id }}
          path: ${{ runner.temp }}/factory-store-migrate.json
          retention-days: 7
          if-no-files-found: error
