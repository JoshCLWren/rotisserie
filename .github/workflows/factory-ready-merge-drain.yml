# Best-effort redundancy only: the dispatcher triggers this workflow on
# its own (healthier) cadence, so this timer is a fallback, not the
# primary driver.
name: Factory Ready Merge Drain
on:
  workflow_call:
    secrets:
      NEON_API_KEY:
        required: false
      OPENROUTER_JEV_API_KEY:
        required: false
      PR_REBASE_TOKEN:
        required: false

env:
  # Operator settings (rotisserie factory settings) reach every factory script.
  FACTORY_REPO_VARS: >-
    {"FACTORY_SLOTS_PER_PROVIDER": "${{ vars.FACTORY_SLOTS_PER_PROVIDER }}", "FACTORY_PR_WIP_LIMIT": "${{ vars.FACTORY_PR_WIP_LIMIT }}", "FACTORY_REVIEW_BACKLOG_LIMIT": "${{ vars.FACTORY_REVIEW_BACKLOG_LIMIT }}", "FACTORY_OMNIROUTE_FREE_ENTRY_CAP": "${{ vars.FACTORY_OMNIROUTE_FREE_ENTRY_CAP }}", "FACTORY_NO_DIFF_RETRY_LIMIT": "${{ vars.FACTORY_NO_DIFF_RETRY_LIMIT }}", "FACTORY_NO_DIFF_RETRY_RESET_SECONDS": "${{ vars.FACTORY_NO_DIFF_RETRY_RESET_SECONDS }}", "FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS": "${{ vars.FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS }}", "FACTORY_FIXED_LEASE_TTL_SECONDS": "${{ vars.FACTORY_FIXED_LEASE_TTL_SECONDS }}", "FACTORY_LOCAL_LEASE_TTL_SECONDS": "${{ vars.FACTORY_LOCAL_LEASE_TTL_SECONDS }}", "FACTORY_PRIORITY_ORDER": "${{ vars.FACTORY_PRIORITY_ORDER }}", "FACTORY_DISABLED_PROVIDERS": "${{ vars.FACTORY_DISABLED_PROVIDERS }}", "FACTORY_DISABLED_MODELS": "${{ vars.FACTORY_DISABLED_MODELS }}", "FACTORY_INCIDENTS": "${{ vars.FACTORY_INCIDENTS }}"}

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  checks: read

jobs:
  merge-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Set up factory Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Check out Rotisserie factory runtime
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .rotisserie/runtime
          persist-credentials: false
      - name: Overlay Rotisserie factory runtime
        run: bash .rotisserie/runtime/factory/install/overlay.sh .

      - name: Ask Jev for CodeRabbit review on the existing drain cadence
        # The dispatcher reliably invokes this workflow; an independent hourly
        # GitHub cron was starved. Review failures must not block safe merges.
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_JEV_API_KEY: ${{ secrets.OPENROUTER_JEV_API_KEY }}
          PR_REBASE_TOKEN: ${{ secrets.PR_REBASE_TOKEN }}
        run: |
          set -Eeuo pipefail
          # REST-only listing avoids GraphQL 504s from "gh pr list".
          # The script also inspects recently closed PRs for the 60-minute quota.
          python3 .github/scripts/hourly_coderabbit_review.py \
            --repo "$GITHUB_REPOSITORY"

      # Outside agents hold Neon target claims with no GitHub owner label;
      # merge authorization reads them, so the drain needs the same restricted
      # connection as the controller (never exposed to model jobs).
      - name: Configure shared restricted Neon authority
        uses: ./.github/actions/factory-state-cache
        with:
          neon-api-key: ${{ secrets.NEON_API_KEY }}
          neon-project-id: ${{ vars.NEON_PROJECT_ID }}

      - name: Install factory syntax parsers
        uses: ./.github/actions/factory-syntax

      - name: Let factory scripts read outside-agent claims
        run: python3 -m pip install --quiet --disable-pip-version-check 'asyncpg>=0.30,<1'

      - name: Ensure GitHub CLI supports JSON PR checks
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh pr checks --help 2>&1 | grep -- '--json' >/dev/null; then
            gh --version
            exit 0
          fi

          version='2.97.0'
          archive="gh_${version}_linux_amd64.tar.gz"
          destination="$RUNNER_TEMP/$archive"
          curl -fsSL "https://github.com/cli/cli/releases/download/v${version}/${archive}" -o "$destination"
          printf '%s  %s\n' 'a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112' "$destination" \
            | sha256sum --check --strict
          tar -xzf "$destination" -C "$RUNNER_TEMP"
          gh_dir="$RUNNER_TEMP/gh_${version}_linux_amd64/bin"
          "$gh_dir/gh" pr checks --help | grep -- '--json' >/dev/null
          echo "$gh_dir" >> "$GITHUB_PATH"

      - name: Meter GitHub CLI requests
        shell: bash
        run: |
          set -Eeuo pipefail
          meter_dir="$RUNNER_TEMP/factory-gh-meter"
          mkdir -p "$meter_dir"
          echo "FACTORY_REAL_GH=$(command -v gh)" >> "$GITHUB_ENV"
          cp .github/scripts/factory-gh-meter.sh "$meter_dir/gh"
          chmod +x "$meter_dir/gh"
          echo "FACTORY_GH_CALL_LOG=$RUNNER_TEMP/factory-gh-calls.log" >> "$GITHUB_ENV"
          echo "$meter_dir" >> "$GITHUB_PATH"

      - name: Self-test post-merge closure logic
        shell: bash
        run: |
          python3 .github/scripts/factory_post_merge_closure.py --self-test

      - name: Reconcile serialized migration finalization lane
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/factory_migration_lane.py reconcile

      - name: Recover held or missing workflow runs on factory PR heads
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PR_REBASE_TOKEN || github.token }}
          FALLBACK_GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          # Every factory stage needs CI evidence: the work controller treats
          # missing required checks as "waiting" and never assigns repair work.
          # A bot-opened PR that a reviewer moved to changes-requested before
          # its held runs were approved otherwise deadlocks forever.
          echo 'Recovering action_required workflow runs on current factory PR heads'
          mapfile -t open_heads < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --jq '.[] | select(.labels | map(.name) | any(. == "factory")) | [.head.sha, .number, .head.ref] | @tsv' \
              || gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 500 \
                --json number,headRefName,headRefOid,labels \
                --jq '.[] | select(.labels | map(.name) | any(. == "factory")) | [.headRefOid, .number, .headRefName] | @tsv'
          )
          (( ${#open_heads[@]} > 0 )) || exit 0

          declare -A recovery_attempted=()

          workflow_file_for_name() {
            case "$1" in
              CI) echo 'ci.yml' ;;
              'Fixed Model PR Repair Guard') echo 'fixed-model-pr-repair-guard.yml' ;;
              *) return 1 ;;
            esac
          }

          dispatch_recovery() {
            local pr="$1" branch="$2" workflow_name="$3" workflow_file key
            local primary_error fallback_error
            workflow_file="$(workflow_file_for_name "$workflow_name")" || return 0
            key="${pr}:${workflow_file}"
            [[ -z "${recovery_attempted[$key]:-}" ]] || return 0
            recovery_attempted[$key]=true
            if primary_error="$(gh workflow run "$workflow_file" --ref "$branch" 2>&1)"; then
              echo "Dispatched ${workflow_name} recovery for PR #${pr} on ${branch}"
              return 0
            fi
            if fallback_error="$(GH_TOKEN="$FALLBACK_GH_TOKEN" gh workflow run \
              "$workflow_file" --ref "$branch" 2>&1)"; then
              echo "Dispatched ${workflow_name} recovery for PR #${pr} on ${branch} with fallback token"
              return 0
            fi
            primary_error="${primary_error//$'\n'/ }"
            fallback_error="${fallback_error//$'\n'/ }"
            echo "Dispatch errors for PR #${pr}: primary=${primary_error:-unknown}; fallback=${fallback_error:-unknown}" >&2
            return 1
          }

          approve_run() {
            local run_id="$1"
            local primary_error fallback_error
            if primary_error="$(gh api -X POST \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve" 2>&1 >/dev/null)"; then
              return 0
            fi
            if fallback_error="$(GH_TOKEN="$FALLBACK_GH_TOKEN" gh api -X POST \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve" 2>&1 >/dev/null)"; then
              return 0
            fi
            primary_error="${primary_error//$'\n'/ }"
            fallback_error="${fallback_error//$'\n'/ }"
            echo "Approval errors: primary=${primary_error:-unknown}; fallback=${fallback_error:-unknown}" >&2
            return 1
          }

          held_runs_file="$RUNNER_TEMP/action-required-runs.json"
          if ! gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs?status=action_required&per_page=100" \
            > "$held_runs_file"; then
            echo 'Unable to enumerate action_required workflow runs; continuing with missing-check recovery' >&2
            printf '[]\n' > "$held_runs_file"
          fi

          while IFS=$'\t' read -r run_id head_sha name; do
            [[ -n "$run_id" && -n "$head_sha" ]] || continue
            for entry in "${open_heads[@]}"; do
              IFS=$'\t' read -r open_head open_pr open_branch <<< "$entry"
              if [[ "$head_sha" == "$open_head" ]]; then
                if approve_run "$run_id"; then
                  echo "Approved held ${name} run ${run_id} on PR #${open_pr} head ${head_sha:0:12}"
                  workflow_file="$(workflow_file_for_name "$name" || true)"
                  [[ -z "$workflow_file" ]] || recovery_attempted["${open_pr}:${workflow_file}"]=true
                else
                  echo "Unable to approve run ${run_id} on PR #${open_pr}; dispatching exact-branch recovery" >&2
                  dispatch_recovery "$open_pr" "$open_branch" "$name" || true
                fi
                break
              fi
            done
          done < <(
            jq -r '.[]?.workflow_runs[]? | [.id, .head_sha, .name] | @tsv' "$held_runs_file"
          )

          for entry in "${open_heads[@]}"; do
            IFS=$'\t' read -r open_head open_pr open_branch <<< "$entry"
            ci_count="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${open_head}&per_page=1" \
              --jq '.total_count' 2>/dev/null || echo 0)"
            guard_count="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/fixed-model-pr-repair-guard.yml/runs?head_sha=${open_head}&per_page=1" \
              --jq '.total_count' 2>/dev/null || echo 0)"
            if [[ "${ci_count:-0}" == "0" ]]; then
              echo "PR #${open_pr} has no CI run at head ${open_head:0:12}; dispatching recovery"
              dispatch_recovery "$open_pr" "$open_branch" 'CI' || true
            fi
            if [[ "${guard_count:-0}" == "0" ]]; then
              echo "PR #${open_pr} has no repair-guard run at head ${open_head:0:12}; dispatching recovery"
              dispatch_recovery "$open_pr" "$open_branch" 'Fixed Model PR Repair Guard' || true
            fi
          done

      - name: Check main health before merging
        id: main_health
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_MAIN_CI_WORKFLOWS: ${{ vars.FACTORY_MAIN_CI_WORKFLOWS }}
        run: |
          set -Eeuo pipefail
          # Serialized merges: the next merge waits until the exact main commit
          # has passed product CI. No CI run means unverified, never green, and
          # an unverified main gets its product CI dispatched here (GITHUB_TOKEN
          # merges fire no push event, so nothing else would run it).
          # Fetched once; the drain step hands this snapshot to the gate.
          snapshot="$RUNNER_TEMP/factory-main-health.json"
          if ! result="$(python3 .github/scripts/factory_main_health.py ensure-verification --repo "$GITHUB_REPOSITORY")"; then
            echo "Could not prove product CI health of main; no merge this run" >&2
            echo "state=unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$result" > "$snapshot"
          state="$(jq -r '.main.state' <<< "$result")"
          jq -r '.main.explanation' <<< "$result"
          dispatched="$(jq -r '.dispatched | join(", ")' <<< "$result")"
          [[ -z "$dispatched" ]] || echo "Dispatched product CI on main: ${dispatched}"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Drain exact-head ready factory PRs
        # Green main merges normally; red main admits only the main-repair lane
        # (main-breakage PRs). Pending or unverified main waits for its CI.
        if: steps.main_health.outputs.state == 'green' || steps.main_health.outputs.state == 'red'
        shell: bash
        env:
          # A configured but unconnected claim store holds merges closed.
          FACTORY_NEON_CONFIGURED: ${{ vars.NEON_PROJECT_ID != '' }}
          GH_TOKEN: ${{ github.token }}
          FACTORY_MAIN_CI_WORKFLOWS: ${{ vars.FACTORY_MAIN_CI_WORKFLOWS }}
          MAIN_STATE: ${{ steps.main_health.outputs.state }}
        run: |
          set -Eeuo pipefail
          review_controller='.github/scripts/factory-review-controller.py'
          closure_script='.github/scripts/factory_post_merge_closure.py'
          main_health='.github/scripts/factory_main_health.py'
          # shellcheck source=/dev/null
          source .github/scripts/factory-dispatch-production-deploy.sh
          # GITHUB_TOKEN merges fire no push event, so dispatch Deploy
          # Production after this run's merge (EXIT trap so a later failure
          # cannot skip it).
          merged_count=0
          dispatch_deploy_after_merges() {
            if (( merged_count > 0 )); then
              factory_dispatch_production_deploy "Factory Ready Merge Drain merged ${merged_count} PR(s)"
            fi
          }
          trap dispatch_deploy_after_merges EXIT

          complete_post_merge_closure() {
            local pr="$1"
            python3 "$closure_script" --pr "$pr" || {
              echo "Post-merge closure for PR #${pr} failed; the stranded-closure sweep will retry" >&2
              return 1
            }
          }

          # One merge per run: release the claim, dispatch product CI on the
          # resulting main, and stop. The next merge waits for that verdict.
          finish_merge() {
            local pr="$1" previous="$2" after
            merged_count=$((merged_count + 1))
            complete_post_merge_closure "$pr" || true
            if after="$(python3 "$main_health" after-merge --repo "$GITHUB_REPOSITORY" --previous "$previous")"; then
              echo "Resulting main: $(jq -r '.main.explanation // empty' <<< "$after")"
            else
              echo "Could not dispatch verification of the resulting main; the next drain dispatches it" >&2
            fi
          }

          echo 'Sweeping recently merged factory PRs for stranded issue closures'
          python3 "$closure_script" --sweep || {
            echo 'Stranded-closure sweep failed; retrying on the next drain' >&2
          }

          mapfile -t ready_prs < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --jq '.[] | select(.labels | map(.name) | contains(["factory:ready"])) | [.number, .head.sha, ([.labels[].name] | join(","))] | @tsv' 2>/dev/null \
              || gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 500 \
                --label 'factory:ready' \
                --json number,headRefOid,labels \
                --jq '.[] | [.number, .headRefOid, ([.labels[].name] | join(","))] | @tsv'
          )

          if (( ${#ready_prs[@]} == 0 )); then
            echo 'No factory:ready PRs to drain'
            exit 0
          fi

          for candidate in "${ready_prs[@]}"; do
            IFS=$'\t' read -r pr expected_head labels <<< "$candidate"
            [[ -n "$pr" && -n "$expected_head" ]] || continue
            if [[ "${MAIN_STATE:-}" == red &&",${labels}," != *",main-breakage,"* ]]; then
              continue
            fi
            authorization="$(python3 "$review_controller" authorized --pr "$pr")" || {
              echo "Unable to verify semantic authorization for PR #${pr}; leaving it open" >&2
              continue
            }
            [[ "$(jq -r '.authorized // false' <<< "$authorization")" == 'true' ]] || {
              echo "PR #${pr} lacks semantic authorization; leaving it open"
              continue
            }
            [[ "$(jq -r '.head // empty' <<< "$authorization")" == "$expected_head" ]] || {
              echo "PR #${pr} authorization is stale; leaving it open"
              continue
            }

            gate="$(python3 "$review_controller" gates --pr "$pr" --expected-head "$expected_head")" || {
              echo "Unable to evaluate mechanical gates for PR #${pr}; leaving it open" >&2
              continue
            }
            gate_decision="$(jq -r '.decision // "retry"' <<< "$gate")"
            gate_reason="$(jq -r '.reason // "mechanical gate result unavailable"' <<< "$gate")"
            case "$gate_decision" in
              pass) ;;
              retry)
                echo "PR #${pr} mechanical gates are retry-later: ${gate_reason}"
                continue
                ;;
              deny)
                echo "PR #${pr} mechanical gates deny merge: ${gate_reason}"
                python3 "$review_controller" demote-ready --pr "$pr" || echo "Unable to demote ready PR #${pr}; retrying next tick" >&2
                continue
                ;;
              *)
                echo "PR #${pr} returned an unknown mechanical gate decision; leaving it open" >&2
                continue
                ;;
            esac

            # Re-check main and take the exclusive merge claim on its exact SHA.
            # Reuses this run's main snapshot and the listing's labels; only
            # main's SHA is re-read before the claim.
            serial="$(python3 "$main_health" gate --repo "$GITHUB_REPOSITORY" --pr "$pr" \
              --labels "$labels" --health-file "$RUNNER_TEMP/factory-main-health.json")" || {
              echo "Unable to evaluate the serialized merge gate; no merge this run" >&2
              exit 0
            }
            if [[ "$(jq -r '.allow' <<< "$serial")" != 'true' ]]; then
              echo "PR #${pr} waits: $(jq -r '.reason' <<< "$serial")"
              [[ "$(jq -r '.main.state' <<< "$serial")" == red ]] && continue
              exit 0
            fi
            main_before="$(jq -r '.main.sha' <<< "$serial")"

            echo "Merging semantically authorized ready PR #${pr} at ${expected_head} onto main ${main_before} ($(jq -r '.lane' <<< "$serial") lane)"
            if gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" \
              --merge --match-head-commit "$expected_head"; then
              echo "Merged ready PR #${pr}"
              finish_merge "$pr" "$main_before"
              exit 0
            fi

            state="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || true)"
            if [[ "$state" == "MERGED" ]]; then
              echo "PR #${pr} was merged by another actor; completing any interrupted post-merge closure"
              # The merge may have landed even though gh errored; count it so
              # the deploy is still dispatched and main is still verified.
              finish_merge "$pr" "$main_before"
              exit 0
            fi
            python3 "$main_health" release --repo "$GITHUB_REPOSITORY" --sha "$main_before" >/dev/null || true
            echo "Unable to merge ready PR #${pr}; it will retry on the next drain" >&2
          done

      - name: Report GitHub CLI request usage
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          python3 .github/scripts/factory_gh_usage.py "${FACTORY_GH_CALL_LOG:-/dev/null}" \
            --label "merge drain" --summary "$GITHUB_STEP_SUMMARY"
