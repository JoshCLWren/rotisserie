# Incident #2309: promote one exact-head factory PR as github-actions[bot]
# so Factory Ready Merge Drain can merge without human intervention.
name: Factory Incident Bot Promote
on:
  workflow_call:
    inputs:
      pr:
        type: string
        required: false
      worker:
        type: string
        required: false

env:
  # Operator settings (rotisserie factory settings) reach every factory script.
  FACTORY_REPO_VARS: >-
    {"FACTORY_SLOTS_PER_PROVIDER": "${{ vars.FACTORY_SLOTS_PER_PROVIDER }}", "FACTORY_PR_WIP_LIMIT": "${{ vars.FACTORY_PR_WIP_LIMIT }}", "FACTORY_REVIEW_BACKLOG_LIMIT": "${{ vars.FACTORY_REVIEW_BACKLOG_LIMIT }}", "FACTORY_OMNIROUTE_FREE_ENTRY_CAP": "${{ vars.FACTORY_OMNIROUTE_FREE_ENTRY_CAP }}", "FACTORY_NO_DIFF_RETRY_LIMIT": "${{ vars.FACTORY_NO_DIFF_RETRY_LIMIT }}", "FACTORY_NO_DIFF_RETRY_RESET_SECONDS": "${{ vars.FACTORY_NO_DIFF_RETRY_RESET_SECONDS }}", "FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS": "${{ vars.FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS }}", "FACTORY_FIXED_LEASE_TTL_SECONDS": "${{ vars.FACTORY_FIXED_LEASE_TTL_SECONDS }}", "FACTORY_LOCAL_LEASE_TTL_SECONDS": "${{ vars.FACTORY_LOCAL_LEASE_TTL_SECONDS }}", "FACTORY_PRIORITY_ORDER": "${{ vars.FACTORY_PRIORITY_ORDER }}", "FACTORY_DISABLED_PROVIDERS": "${{ vars.FACTORY_DISABLED_PROVIDERS }}", "FACTORY_DISABLED_MODELS": "${{ vars.FACTORY_DISABLED_MODELS }}", "FACTORY_INCIDENTS": "${{ vars.FACTORY_INCIDENTS }}"}

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Set up factory Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Check out Rotisserie factory runtime
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .rotisserie/runtime
          persist-credentials: false
      - name: Overlay Rotisserie factory runtime
        run: bash .rotisserie/runtime/factory/install/overlay.sh .

      - name: Install factory syntax parsers
        uses: ./.github/actions/factory-syntax

      - name: Promote PR with trusted review controller
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          pr="${{ inputs.pr }}"
          worker="${{ inputs.worker }}"
          [[ "$pr" =~ ^[0-9]+$ ]] || { echo "invalid pr"; exit 1; }
          [[ "$worker" =~ ^[0-9]+$ ]] || { echo "invalid worker"; exit 1; }

          head="$(gh pr view "$pr" --json headRefOid --jq .headRefOid)"
          branch="$(gh pr view "$pr" --json headRefName --jq .headRefName)"
          producer="$(sed -nE 's#^factory/([0-9]+)-.*#\1#p' <<< "$branch")"
          if [[ -n "$producer" && "$producer" == "$worker" ]]; then
            echo "reviewer $worker is the producer; refusing self-review"
            exit 1
          fi

          gh api --method PUT "repos/${GITHUB_REPOSITORY}/issues/${pr}/labels" \
            --input - <<< "$(jq -nc --arg w "factory:$worker" '["factory","factory:review",$w]')"

          log="/tmp/opencode-factory-${worker}.sanitized.log"
          {
            echo "Incident bot promote for PR #${pr}"
            echo "FACTORY_GATE_READY"
            gh pr diff "$pr" | head -n 120 || true
            # Must land in the last 7000 chars of the excerpt window.
            printf '%s\n' "# ${GITHUB_REPOSITORY#*/}-factory-authoritative-diff-evidence" "gh pr diff ${pr}"
          } > "$log"

          python3 .github/scripts/factory-review-controller.py review \
            --worker "$worker" \
            --pr "$pr" \
            --reviewed-head "$head" \
            --verdict approve \
            --review-log "$log"

          gh pr view "$pr" --json labels --jq '[.labels[].name]'

      - name: Trigger ready merge drain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run factory-ready-merge-drain.yml --ref main
          echo "Dispatched Factory Ready Merge Drain"
