name: Factory Revocation Fence
on:
  workflow_call:

env:
  # Operator settings (rotisserie factory settings) reach every factory script.
  FACTORY_REPO_VARS: >-
    {"FACTORY_SLOTS_PER_PROVIDER": "${{ vars.FACTORY_SLOTS_PER_PROVIDER }}", "FACTORY_PR_WIP_LIMIT": "${{ vars.FACTORY_PR_WIP_LIMIT }}", "FACTORY_REVIEW_BACKLOG_LIMIT": "${{ vars.FACTORY_REVIEW_BACKLOG_LIMIT }}", "FACTORY_OMNIROUTE_FREE_ENTRY_CAP": "${{ vars.FACTORY_OMNIROUTE_FREE_ENTRY_CAP }}", "FACTORY_NO_DIFF_RETRY_LIMIT": "${{ vars.FACTORY_NO_DIFF_RETRY_LIMIT }}", "FACTORY_NO_DIFF_RETRY_RESET_SECONDS": "${{ vars.FACTORY_NO_DIFF_RETRY_RESET_SECONDS }}", "FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS": "${{ vars.FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS }}", "FACTORY_FIXED_LEASE_TTL_SECONDS": "${{ vars.FACTORY_FIXED_LEASE_TTL_SECONDS }}", "FACTORY_LOCAL_LEASE_TTL_SECONDS": "${{ vars.FACTORY_LOCAL_LEASE_TTL_SECONDS }}", "FACTORY_PRIORITY_ORDER": "${{ vars.FACTORY_PRIORITY_ORDER }}", "FACTORY_DISABLED_PROVIDERS": "${{ vars.FACTORY_DISABLED_PROVIDERS }}", "FACTORY_DISABLED_MODELS": "${{ vars.FACTORY_DISABLED_MODELS }}"}

permissions:
  contents: read
  issues: write
  pull-requests: write

# Factory branches use the canonical factory/<worker>-<issue>-<suffix> shape;
# the fence rejects a producer that no longer owns open issue before re-entry.
jobs:
  verify-factory-provenance:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'factory/')
    runs-on: ubuntu-latest
    steps:
      - name: Set up factory Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Checkout trusted fence implementation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check out Rotisserie factory runtime
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .rotisserie/runtime
          persist-credentials: false
      - name: Overlay Rotisserie factory runtime
        run: bash .rotisserie/runtime/factory/install/overlay.sh .

      - name: Reject PRs without durable factory provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail

          # Noncanonical maintenance branches are not worker claims. Even a
          # GitHub API outage must not revoke their normal PRs.
          if [[ ! "$HEAD_REF" =~ ^factory/[0-9]+-[0-9]+- ]]; then
            echo "Noncanonical maintenance branch: no worker provenance required."
            exit 0
          fi

          comments="$RUNNER_TEMP/factory-pr-comments.json"
          decision="$RUNNER_TEMP/factory-fence-decision.json"
          api_read_succeeded=false

          # PR creation and the worker's provenance comment are separate API calls.
          # Give the trusted worker a short window to finish that persistence handoff.
          for attempt in {1..12}; do
            if gh api --paginate --slurp \
              "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" >"$comments"; then
              api_read_succeeded=true
              set +e
              python3 .github/scripts/factory-revocation-fence.py \
                --head-ref "$HEAD_REF" \
                --pr-number "$PR_NUMBER" \
                --head-sha "$HEAD_SHA" \
                --comments-json "$comments" >"$decision"
              status=$?
              set -e
              cat "$decision"
              if (( status == 0 )); then
                echo "Factory PR #${PR_NUMBER} has exact durable producer provenance."
                exit 0
              fi
            else
              echo "Unable to read factory provenance on attempt ${attempt}; fence remains fail-closed."
            fi

            (( attempt < 12 )) && sleep 5
          done

          if [[ "$api_read_succeeded" != true ]]; then
            set +e
            python3 .github/scripts/factory-revocation-fence.py \
              --head-ref "$HEAD_REF" \
              --pr-number "$PR_NUMBER" \
              --head-sha "$HEAD_SHA" \
              --provenance-unavailable >"$decision"
            set -e
            cat "$decision"
          fi

          reason="$(jq -r '.reason // "provenance-unavailable"' "$decision" 2>/dev/null || printf 'provenance-unavailable')"
          echo "Rejecting factory PR #${PR_NUMBER}: ${reason}."
          gh api --method PATCH "repos/${REPOSITORY}/pulls/${PR_NUMBER}" -f state=closed >/dev/null
          gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="Closed automatically by the Factory Revocation Fence. The canonical factory branch ${HEAD_REF} did not have trusted persistence provenance matching PR #${PR_NUMBER} at ${HEAD_SHA}. This means the assignment was revoked or superseded before persistence, the provenance read failed, or the branch attempted to re-enter with stale provenance."
