# Installed into adopter by factory/install/install.py. Trusted label claims -> shared factory store (#191).
# Every trigger here runs the default-branch workflow file, never a PR's copy.
name: Rotisserie Label Claim Controller
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: false
      targets:
        type: string
        required: false
    secrets:
      FACTORY_TURSO_TOKEN:
        required: false
      # Kept until every adopter re-runs the installer: a caller that still
      # passes it keeps the store required, so the job fails closed.
      NEON_API_KEY:
        required: false
      FACTORY_TURSO_API_TOKEN:
        required: false
      FACTORY_TURSO_URL:
        required: false

permissions:
  contents: read
  # Claim answers (labels, one status comment) and verified hand-offs: the
  # same writes the external claim bridge makes. This job runs no PR code.
  issues: write
  pull-requests: write
  # Factory label writes start no workflow, so the next stage is dispatched.
  actions: write
  checks: read
  statuses: read

env:
  # The store is required wherever the adopter configured one; missing
  # credentials then fail the job instead of running without coordination.
  FACTORY_STATE_REQUIRED: ${{ secrets.FACTORY_TURSO_URL != '' || secrets.NEON_API_KEY != '' }}
  FACTORY_REPO_VARS: >-
    {"FACTORY_SLOTS_PER_PROVIDER": "${{ vars.FACTORY_SLOTS_PER_PROVIDER }}", "FACTORY_PR_WIP_LIMIT": "${{ vars.FACTORY_PR_WIP_LIMIT }}", "FACTORY_REVIEW_BACKLOG_LIMIT": "${{ vars.FACTORY_REVIEW_BACKLOG_LIMIT }}", "FACTORY_OMNIROUTE_FREE_ENTRY_CAP": "${{ vars.FACTORY_OMNIROUTE_FREE_ENTRY_CAP }}", "FACTORY_NO_DIFF_RETRY_LIMIT": "${{ vars.FACTORY_NO_DIFF_RETRY_LIMIT }}", "FACTORY_NO_DIFF_RETRY_RESET_SECONDS": "${{ vars.FACTORY_NO_DIFF_RETRY_RESET_SECONDS }}", "FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS": "${{ vars.FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS }}", "FACTORY_FIXED_LEASE_TTL_SECONDS": "${{ vars.FACTORY_FIXED_LEASE_TTL_SECONDS }}", "FACTORY_LOCAL_LEASE_TTL_SECONDS": "${{ vars.FACTORY_LOCAL_LEASE_TTL_SECONDS }}", "FACTORY_PRIORITY_ORDER": "${{ vars.FACTORY_PRIORITY_ORDER }}", "FACTORY_DISABLED_PROVIDERS": "${{ vars.FACTORY_DISABLED_PROVIDERS }}", "FACTORY_DISABLED_MODELS": "${{ vars.FACTORY_DISABLED_MODELS }}", "FACTORY_INCIDENTS": "${{ vars.FACTORY_INCIDENTS }}"}

jobs:
  claim:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.sender.type != 'Bot' &&
       (github.event_name != 'pull_request_target' ||
        github.event.pull_request.head.repo.full_name == github.repository) &&
       (((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
         github.event.label.name == 'factory:claimed') ||
        (github.event_name == 'issue_comment' &&
         contains(github.event.issue.labels.*.name, 'factory:claimed')) ||
        (github.event_name == 'pull_request_target' &&
         github.event.action == 'synchronize' &&
         contains(github.event.pull_request.labels.*.name, 'factory:claimed')) ||
        (github.event_name == 'pull_request_target' &&
         contains(fromJSON('["opened","ready_for_review","edited"]'), github.event.action) &&
         !github.event.pull_request.draft)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse reruns and impersonated triggers
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$TRIGGERING_ACTOR" == "$GITHUB_ACTOR" ]]

      - name: Check out adopter
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Check out Rotisserie factory runtime
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .rotisserie/runtime
          persist-credentials: false
      - name: Overlay Rotisserie factory runtime
        run: bash .rotisserie/runtime/factory/install/overlay.sh .
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7

      # The doctor must still run when the store is down: it then withholds every
      # factory:available and touches no claim. Claim events need the store.
      - name: Configure the shared factory store
        continue-on-error: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        uses: ./.github/actions/factory-store
        with:
          url: ${{ secrets.FACTORY_TURSO_URL }}
          token: ${{ secrets.FACTORY_TURSO_TOKEN }}

      - name: Answer the claim event or run the label doctor
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          TARGETS: ${{ inputs.targets }}
          # The Turso Platform API token reaches only the db-usage read.
          FACTORY_TURSO_API_TOKEN: ${{ inputs.mode == 'db-usage' && secrets.FACTORY_TURSO_API_TOKEN || '' }}
          FACTORY_TURSO_ORG: ${{ vars.FACTORY_TURSO_ORG }}
          FACTORY_TURSO_DATABASE: ${{ vars.FACTORY_TURSO_DATABASE }}
        run: |
          set -Eeuo pipefail
          test -f .rotisserie/runtime/pyproject.toml
          rotisserie=(uv tool run --from ./.rotisserie/runtime rotisserie)
          case "$GITHUB_EVENT_NAME" in
            schedule) args=(factory labels --repair) ;;
            workflow_dispatch)
              case "$MODE" in
                repair) args=(factory labels --repair) ;;
                delete-legacy) args=(factory labels --repair --delete-legacy) ;;
                backoffs) args=(factory backoffs) ;;
                leases)
                  read -r -a wanted <<< "${TARGETS:-}"
                  for item in "${wanted[@]}"; do
                    [[ "$item" =~ ^(issue|pr):[1-9][0-9]*$ ]] || exit 2
                  done
                  args=(factory leases "${wanted[@]}") ;;
                # One bounded read-only store query; publishes per-item counts only.
                estimate-history) args=(factory estimate-history) ;;
                # Turso usage API only; publishes counts, never the token or URL.
                db-usage) args=(factory db-usage --live) ;;
                # Every schema statement is IF NOT EXISTS; publishes names and counts only.
                schema-apply) args=(factory schema --apply) ;;
                *) args=(factory labels) ;;
              esac ;;
            *)
              test -s "${FACTORY_TURSO_TOKEN_FILE:-}"
              args=(factory label-event --event-path "$GITHUB_EVENT_PATH") ;;
          esac
          "${rotisserie[@]}" "${args[@]}" --repo "$GITHUB_REPOSITORY" --json \
            > "$RUNNER_TEMP/label-claim.json"
          handed=$(jq -r 'if .operation == "handoff" and .status == "released" then "yes" else "no" end' \
            "$RUNNER_TEMP/label-claim.json" 2>/dev/null || echo no)
          echo "handed_off=$handed" >> "$GITHUB_OUTPUT"
          jq -r '"Status: \(.status // .mode // "unknown")  Reason: \(.reason // "none")"' \
            "$RUNNER_TEMP/label-claim.json" >> "$GITHUB_STEP_SUMMARY" || true

      # An outside review hand-off leaves the PR in factory:ci; promote it
      # through the canonical gates exactly as the local review attestation does.
      - name: Reconcile canonical gates and wake merge drain
        if: steps.run.outputs.handed_off == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/factory-review-controller.py reconcile-ci
          gh workflow run factory-ready-merge-drain.yml --ref main

      - name: Publish bounded result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rotisserie-label-claim-${{ github.run_id }}
          path: ${{ runner.temp }}/label-claim.json
          retention-days: 1
          if-no-files-found: warn
      - name: Remove the factory store token
        if: always()
        run: rm -f "$RUNNER_TEMP/factory-store-token"
