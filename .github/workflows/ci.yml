name: Rotisserie CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rotisserie-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rotisserie-core:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Verify Rotisserie
        run: uv run --locked --python ${{ matrix.python-version }} ./scripts/verify

      - name: Build distributions
        if: matrix.python-version == '3.14'
        run: uv build

      - name: Smoke test the installed wheel
        run: |
          wheel=(dist/*.whl)
          uv run --no-project --with "${wheel[0]}" python -I -c             'import _rotisserie_native; from rotisserie.factory_console import runtime; runtime.module("factory_eligibility")'
          uv run --no-project --with "${wheel[0]}" baste --help

  factory-runtime:
    name: Factory runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: factory

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install shell test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep shellcheck jq
          git config --global user.name "Rotisserie CI"
          git config --global user.email "rotisserie-ci@users.noreply.github.com"

      - name: Install locked factory environment
        run: uv sync --locked --python 3.14

      - name: Factory Python tests
        run: uv run --locked --python 3.14 pytest -q -n auto

      - name: Factory JavaScript tests
        run: node --test .github/scripts/*.test.cjs scripts/local-factory-acp-review.test.mjs

      - name: Factory shell scripts
        run: |
          find .github/scripts scripts -type f -name '*.sh' -print0 | xargs -0 -r -n 1 bash -n
          find .github/scripts scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=error
