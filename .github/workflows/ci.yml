name: Rotisserie CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rotisserie-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rotisserie-core:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Verify Rotisserie
        run: uv run --locked --python ${{ matrix.python-version }} ./scripts/verify

      - name: Build distributions
        if: matrix.python-version == '3.14'
        run: uv build
