name: Rotisserie CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rotisserie-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rotisserie-core:
    name: Rotisserie core
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q prototype tests

      - name: Test Rotisserie
        run: python -m pytest -q prototype tests
