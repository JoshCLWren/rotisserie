name: Factory Issue Wakeup
on:
  workflow_call:

env:
  # Operator settings (rotisserie factory settings) reach every factory script.
  FACTORY_REPO_VARS: >-
    {"FACTORY_SLOTS_PER_PROVIDER": "${{ vars.FACTORY_SLOTS_PER_PROVIDER }}", "FACTORY_PR_WIP_LIMIT": "${{ vars.FACTORY_PR_WIP_LIMIT }}", "FACTORY_REVIEW_BACKLOG_LIMIT": "${{ vars.FACTORY_REVIEW_BACKLOG_LIMIT }}", "FACTORY_OMNIROUTE_FREE_ENTRY_CAP": "${{ vars.FACTORY_OMNIROUTE_FREE_ENTRY_CAP }}", "FACTORY_NO_DIFF_RETRY_LIMIT": "${{ vars.FACTORY_NO_DIFF_RETRY_LIMIT }}", "FACTORY_NO_DIFF_RETRY_RESET_SECONDS": "${{ vars.FACTORY_NO_DIFF_RETRY_RESET_SECONDS }}", "FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS": "${{ vars.FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS }}", "FACTORY_FIXED_LEASE_TTL_SECONDS": "${{ vars.FACTORY_FIXED_LEASE_TTL_SECONDS }}", "FACTORY_LOCAL_LEASE_TTL_SECONDS": "${{ vars.FACTORY_LOCAL_LEASE_TTL_SECONDS }}", "FACTORY_PRIORITY_ORDER": "${{ vars.FACTORY_PRIORITY_ORDER }}", "FACTORY_DISABLED_PROVIDERS": "${{ vars.FACTORY_DISABLED_PROVIDERS }}", "FACTORY_DISABLED_MODELS": "${{ vars.FACTORY_DISABLED_MODELS }}", "FACTORY_INCIDENTS": "${{ vars.FACTORY_INCIDENTS }}"}

permissions:
  actions: write
  contents: read

jobs:
  wake:
    # Claim labels belong to the label claim controller; waking a factory
    # worker on them would race the agent that asked for the item. State
    # labels (factory_state_labels.py) only mirror the store.
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'factory:unowned') &&
      !contains(github.event.issue.labels.*.name, 'factory:claimed') &&
      !contains(fromJSON('["factory:available","factory:claimed","factory:claim-rejected"]'), github.event.label.name) &&
      !contains(fromJSON('["factory:parked","factory:needs-split","factory:gate-rejected","factory:duplicate","factory:cooling","factory:incident-work"]'), github.event.label.name)
    runs-on: ubuntu-latest
    steps:
      - name: Offer changed issue to trusted dispatcher
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -Eeuo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          # One new issue fires opened plus one labeled event per label. A
          # dispatch for this issue that has not finished yet covers them all;
          # duplicates queue behind the dispatcher's single assignment lock.
          since="$(date -u -d '-15 minutes' +%Y-%m-%dT%H:%M:%SZ)"
          pending="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/fixed-model-factory-dispatch.yml/runs?created=>=${since}&per_page=100" \
            --jq "[.workflow_runs[] | select(.status != \"completed\" and .display_title == \"Factory dispatch · issue:${ISSUE_NUMBER}\")] | length" \
            2>/dev/null || echo 0)"
          if [[ "$pending" =~ ^[1-9][0-9]*$ ]]; then
            echo "A dispatch for issue #${ISSUE_NUMBER} is already waiting; not sending another"
            exit 0
          fi
          gh workflow run fixed-model-factory-dispatch.yml \
            --repo "$GITHUB_REPOSITORY" --ref main \
            -f target="issue:$ISSUE_NUMBER" -f action=advance
