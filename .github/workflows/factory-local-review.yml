name: Attest Actual Local Factory Reviews
on:
  workflow_call:
    inputs:
      evidence:
        type: string
        required: false
    secrets:
      NEON_API_KEY:
        required: false

env:
  # Operator settings (rotisserie factory settings) reach every factory script.
  FACTORY_REPO_VARS: >-
    {"FACTORY_SLOTS_PER_PROVIDER": "${{ vars.FACTORY_SLOTS_PER_PROVIDER }}", "FACTORY_PR_WIP_LIMIT": "${{ vars.FACTORY_PR_WIP_LIMIT }}", "FACTORY_REVIEW_BACKLOG_LIMIT": "${{ vars.FACTORY_REVIEW_BACKLOG_LIMIT }}", "FACTORY_OMNIROUTE_FREE_ENTRY_CAP": "${{ vars.FACTORY_OMNIROUTE_FREE_ENTRY_CAP }}", "FACTORY_NO_DIFF_RETRY_LIMIT": "${{ vars.FACTORY_NO_DIFF_RETRY_LIMIT }}", "FACTORY_NO_DIFF_RETRY_RESET_SECONDS": "${{ vars.FACTORY_NO_DIFF_RETRY_RESET_SECONDS }}", "FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS": "${{ vars.FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS }}", "FACTORY_FIXED_LEASE_TTL_SECONDS": "${{ vars.FACTORY_FIXED_LEASE_TTL_SECONDS }}", "FACTORY_LOCAL_LEASE_TTL_SECONDS": "${{ vars.FACTORY_LOCAL_LEASE_TTL_SECONDS }}", "FACTORY_PRIORITY_ORDER": "${{ vars.FACTORY_PRIORITY_ORDER }}", "FACTORY_DISABLED_PROVIDERS": "${{ vars.FACTORY_DISABLED_PROVIDERS }}", "FACTORY_DISABLED_MODELS": "${{ vars.FACTORY_DISABLED_MODELS }}"}

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

jobs:
  attest:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Set up factory Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Check out Rotisserie factory runtime
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .rotisserie/runtime
          persist-credentials: false
      - name: Overlay Rotisserie factory runtime
        run: bash .rotisserie/runtime/factory/install/overlay.sh .
      - name: Validate original evidence and attest as trusted controller
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_REVIEW_EVIDENCE: ${{ inputs.evidence }}
        run: python3 .github/scripts/factory_local_review.py
      # reconcile-ci must see outside-agent Neon claims (no GitHub owner
      # label) so it never moves a PR an outside agent is working on.
      - name: Configure shared restricted Neon authority
        uses: ./.github/actions/factory-state-cache
        with:
          neon-api-key: ${{ secrets.NEON_API_KEY }}
          neon-project-id: ${{ vars.NEON_PROJECT_ID }}

      - name: Let factory scripts read outside-agent claims
        run: python3 -m pip install --quiet --disable-pip-version-check 'asyncpg>=0.30,<1'

      - name: Reconcile canonical gates and wake merge drain
        env:
          # A configured but unconnected claim store holds promotion closed.
          FACTORY_NEON_CONFIGURED: ${{ vars.NEON_PROJECT_ID != '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/factory-review-controller.py reconcile-ci
          gh workflow run factory-ready-merge-drain.yml --ref main
