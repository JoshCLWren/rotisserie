name: Factory FCM Provider Credential Health
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Sample up to five upstream models per configured provider, or probe the full upstream catalog
        required: true
        default: sample
        type: choice
        options:
          - sample
          - all
permissions:
  contents: read
jobs:
  rotisserie:
    uses: JoshCLWren/rotisserie/.github/workflows/factory-fcm-provider-health.yml@main
    with:
      scope: ${{ inputs.scope }}
    secrets:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
      REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
      ROUTEWAY_API_KEY: ${{ secrets.ROUTEWAY_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      SAMBA_NOVA_API_KEY: ${{ secrets.SAMBA_NOVA_API_KEY }}
      SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
