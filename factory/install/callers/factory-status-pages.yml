name: Factory Status Pages
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Fixed Model Factory Dispatcher"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/factory-status-pages.yml'
permissions:
  contents: write
  issues: read
  pull-requests: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: factory-status-pages-${{ github.event_name == 'push' && 'push' || 'refresh' }}
  # Retain queued runs: without this, a newer push replaces a queued push run
  # and drops its Pages deployment.
  queue: max
  cancel-in-progress: false
jobs:
  rotisserie:
    cache-mode: read
    uses: JoshCLWren/rotisserie/.github/workflows/factory-status-pages.yml@main
    secrets:
      FACTORY_TURSO_API_TOKEN: ${{ secrets.FACTORY_TURSO_API_TOKEN }}
      FACTORY_TURSO_TOKEN: ${{ secrets.FACTORY_TURSO_TOKEN }}
      FACTORY_TURSO_URL: ${{ secrets.FACTORY_TURSO_URL }}
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      OMNIROUTE_MANAGEMENT_API_KEY: ${{ secrets.OMNIROUTE_MANAGEMENT_API_KEY }}
