name: Fixed Model Factory Entry
run-name: Factory ${{ inputs.worker }} · ${{ inputs.model || 'auto' }} · fixed-model entry
on:
  workflow_dispatch:
    inputs:
      assignment:
        description: Bounded dispatcher assignment with target, exact head and claim token
        required: true
        type: string
      worker:
        description: Active fixed-model Factory number from the roster
        required: true
        type: string
      model:
        description: Optional exact model selected by trusted dispatcher
        required: false
        default: auto
        type: string
      provider:
        description: Optional pinned existing provider source for model-first work
        required: false
        default: auto
        type: string
permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write
  actions: write
  checks: read
jobs:
  rotisserie:
    uses: JoshCLWren/rotisserie/.github/workflows/free-model-factory-entry.yml@main
    with:
      assignment: ${{ inputs.assignment }}
      worker: ${{ inputs.worker }}
      model: ${{ inputs.model }}
      provider: ${{ inputs.provider }}
    secrets:
      AION_API_KEY: ${{ secrets.AION_API_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      FACTORY_READER_APP_ID: ${{ secrets.FACTORY_READER_APP_ID }}
      FACTORY_READER_APP_PRIVATE_KEY: ${{ secrets.FACTORY_READER_APP_PRIVATE_KEY }}
      FACTORY_WORKER_48_APP_ID: ${{ secrets.FACTORY_WORKER_48_APP_ID }}
      FACTORY_WORKER_48_APP_PRIVATE_KEY: ${{ secrets.FACTORY_WORKER_48_APP_PRIVATE_KEY }}
      FACTORY_WORKER_48_INSTALLATION_ID: ${{ secrets.FACTORY_WORKER_48_INSTALLATION_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      OMNIROUTE_MANAGEMENT_API_KEY: ${{ secrets.OMNIROUTE_MANAGEMENT_API_KEY }}
      OPENCODE_GO_CLIENT_ID: ${{ secrets.OPENCODE_GO_CLIENT_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      PR_REBASE_TOKEN: ${{ secrets.PR_REBASE_TOKEN }}
      REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
      ROTISSERIE_FACTORY_APP_ID: ${{ secrets.ROTISSERIE_FACTORY_APP_ID }}
      ROTISSERIE_FACTORY_APP_PRIVATE_KEY: ${{ secrets.ROTISSERIE_FACTORY_APP_PRIVATE_KEY }}
      ROTISSERIE_FACTORY_INSTALLATION_ID: ${{ secrets.ROTISSERIE_FACTORY_INSTALLATION_ID }}
      TYPHOON_API_KEY: ${{ secrets.TYPHOON_API_KEY }}
      Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
