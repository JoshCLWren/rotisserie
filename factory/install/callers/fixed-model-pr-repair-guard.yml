name: Fixed Model PR Repair Guard
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  issues: read
concurrency:
  group: fixed-model-pr-repair-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rotisserie:
    uses: JoshCLWren/rotisserie/.github/workflows/fixed-model-pr-repair-guard.yml@main
