name: Factory Model Health Reset
on:
  workflow_dispatch:
    inputs:
      include_retired:
        description: Also clear retired HTTP 410 model records
        type: boolean
        default: false
        required: false
      quota_only:
        description: Clear only quota and throttle backoffs; cap real failure streaks at one day
        type: boolean
        default: false
        required: false
      model:
        description: Clear only this exact model ID (its health and backoff rows)
        type: string
        default: ''
        required: false
      source:
        description: With model, clear it only for this provider source
        type: string
        default: ''
        required: false
permissions:
  contents: read
concurrency:
  group: factory-model-health-reset
  cancel-in-progress: false
jobs:
  rotisserie:
    uses: JoshCLWren/rotisserie/.github/workflows/factory-model-health-reset.yml@main
    with:
      include_retired: ${{ inputs.include_retired == true }}
      quota_only: ${{ inputs.quota_only == true }}
      model: ${{ inputs.model }}
      source: ${{ inputs.source }}
    secrets:
      FACTORY_TURSO_TOKEN: ${{ secrets.FACTORY_TURSO_TOKEN }}
      FACTORY_TURSO_URL: ${{ secrets.FACTORY_TURSO_URL }}
