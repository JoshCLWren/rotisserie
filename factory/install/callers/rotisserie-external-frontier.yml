name: Rotisserie External Work Frontier
run-name: Rotisserie next work · ${{ github.actor }}
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
concurrency:
  group: rotisserie-external-frontier
  queue: max
  cancel-in-progress: false
jobs:
  rotisserie:
    uses: JoshCLWren/rotisserie/.github/workflows/rotisserie-external-frontier.yml@main
    secrets:
      FACTORY_TURSO_READ_TOKEN: ${{ secrets.FACTORY_TURSO_READ_TOKEN }}
      FACTORY_TURSO_URL: ${{ secrets.FACTORY_TURSO_URL }}
