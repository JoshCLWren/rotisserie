name: Attest Actual Local Factory Reviews
on:
  workflow_dispatch:
    inputs:
      evidence:
        description: JSON containing exact head, actual local reports, completion metadata and original reviewer acceptance
        required: true
        type: string
permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write
jobs:
  rotisserie:
    uses: JoshCLWren/rotisserie/.github/workflows/factory-local-review.yml@main
    with:
      evidence: ${{ inputs.evidence }}
    secrets:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
