name: Rotisserie Operator
on:
  workflow_dispatch:
    inputs:
      request:
        description: 'One JSON Rotisserie control-room command (not a shell command)'
        required: true
        type: string
permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write
jobs:
  rotisserie:
    uses: JoshCLWren/rotisserie/.github/workflows/rotisserie-operator.yml@main
    with:
      request: ${{ inputs.request }}
