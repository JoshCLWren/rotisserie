name: Publish Factory API Budgets
on:
  workflow_run:
    workflows: ['Factory API Quota Observation']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-factory-api-budgets
  cancel-in-progress: false
jobs:
  rotisserie:
    uses: JoshCLWren/rotisserie/.github/workflows/publish-factory-api-budgets.yml@main
    secrets:
      FACTORY_OBSERVABILITY_APP_ID: ${{ secrets.FACTORY_OBSERVABILITY_APP_ID }}
      FACTORY_OBSERVABILITY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_OBSERVABILITY_APP_PRIVATE_KEY }}
      ROTISSERIE_DEPLOY_KEY: ${{ secrets.ROTISSERIE_DEPLOY_KEY }}
