permissions:
  contents: read
concurrency:
  group: auto-rebase-open-prs-main
  cancel-in-progress: false
jobs:
  rotisserie:
    uses: JoshCLWren/rotisserie/.github/workflows/auto-rebase-open-prs.yml@main
    secrets:
      PR_REBASE_TOKEN: ${{ secrets.PR_REBASE_TOKEN }}
