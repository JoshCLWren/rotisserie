[project]
name = "rotisserie-factory"
version = "0.1.0.dev0"
description = "Rotisserie factory runtime: the workflows, scripts and tests adopter repositories install"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
factory-syntax = [
    "shfmt-py==4.2.0",
    "tree-sitter==0.26.1",
    "tree-sitter-css==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
]
dev = [
    "rotisserie",
    { include-group = "factory-syntax" },
    "pytest>=8.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-asyncio>=1.3.0",
    "filelock>=3.13.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # The ComicPile release publisher (scripts/release_neon_publish.py) writes the
    # application database, not factory state.
    "psycopg[binary]>=3.2",
    # Worker GitHub App display names come from a seeded Faker sequence that
    # changes between releases; persisted App names depend on this exact pin.
    "faker==40.40.0",
]

[tool.uv.sources]
rotisserie = { path = "..", editable = true }

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["tests", ".github/scripts", "scripts/tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
