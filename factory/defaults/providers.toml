# Default OpenAI-compatible providers. Adopters extend, disable or replace these
# in .rotisserie/config.toml under [providers].

[providers."nvidia"]
provider = "nvidia"
credential = "NVIDIA_API_KEY"
endpoint = "https://integrate.api.nvidia.com/v1"
name = "NVIDIA published API models"

[providers."z-ai"]
provider = "z-ai"
credential = "Z_AI_API_KEY"
endpoint = "https://api.z.ai/api/paas/v4"
name = "Z.AI free capacity"

[providers."ollama-cloud"]
provider = "ollama-cloud"
credential = "OLLAMA_API_KEY"
endpoint = "https://ollama.com/v1"
name = "Ollama Cloud free capacity"

[providers."vercel-ai-gateway"]
provider = "vercel"
credential = "AI_GATEWAY_API_KEY"
endpoint = "https://ai-gateway.vercel.sh/v1"
name = "Vercel AI Gateway free capacity"

[providers."mistral"]
provider = "mistral"
credential = "MISTRAL_API_KEY"
endpoint = "https://api.mistral.ai/v1"
name = "Mistral Codestral"

[providers."orcarouter"]
provider = "orcarouter"
credential = "ORCAROUTER_API_KEY"
endpoint = "https://api.orcarouter.ai/v1"
name = "OrcaRouter free capacity"

[providers."pollinations"]
provider = "pollinations"
credential = "POLLINATIONS_API_KEY"
endpoint = "https://gen.pollinations.ai/v1"
catalog_url = "https://gen.pollinations.ai/v1/models?category=text&capabilities=tool_calling&agent=false"
name = "Pollinations AI"

[providers."gemini-free"]
provider = "google"
credential = "GEMINI_API_KEY"
endpoint = "https://generativelanguage.googleapis.com/v1beta/openai"
name = "Google Gemini API Free"
headers = { "x-goog-api-client" = "rotisserie-factory-oai/1.0" }

[providers."groq-free"]
provider = "groq"
credential = "GROQ_API_KEY"
endpoint = "https://api.groq.com/openai/v1"
name = "GroqCloud Free"

[providers."aion-free"]
provider = "aion"
credential = "AION_API_KEY"
endpoint = "https://api.aionlabs.ai/v1"
name = "Aion Labs Daily Free Credit"

[providers."cohere-eval"]
provider = "cohere"
credential = "COHERE_API_KEY"
endpoint = "https://api.cohere.ai/compatibility/v1"
name = "Cohere Evaluation Key"

[providers."typhoon-free"]
provider = "typhoon"
credential = "TYPHOON_API_KEY"
endpoint = "https://api.opentyphoon.ai/v1"
name = "Typhoon Free API"

[providers."cloudflare-workers-ai"]
provider = "cloudflare-workers-ai"
credential = "CLOUDFLARE_API_TOKEN"
endpoint = "https://api.cloudflare.com/client/v4/accounts/{CLOUDFLARE_ACCOUNT_ID}/ai/v1"
catalog_url = "https://api.cloudflare.com/client/v4/accounts/{CLOUDFLARE_ACCOUNT_ID}/ai/models/search?format=openrouter&per_page=100"
name = "Cloudflare Workers AI Free"
additional_credentials = ["CLOUDFLARE_ACCOUNT_ID"]
