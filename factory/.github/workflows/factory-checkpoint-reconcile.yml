name: Factory Checkpoint Reconciliation

# A separate runner survives worker cancellation; scheduled sweeping also covers
# suppressed workflow_run events and temporary publication/API failures.
on:
  workflow_run:
    workflows: [Fixed Model Factory Entry]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Optional canonical factory run ID, otherwise sweep saved checkpoints'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: factory-checkpoint-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Configure restricted Neon factory event ledger
        uses: ./.github/actions/factory-state-cache
        with:
          neon-api-key: ${{ secrets.NEON_API_KEY }}
          neon-project-id: ${{ vars.NEON_PROJECT_ID }}
      - name: Publish saved work and retire incorporated checkpoints
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN: ${{ github.event.workflow_run.id || inputs.run_id || '' }}
        run: |
          set -Eeuo pipefail
          args=(--repo "$GITHUB_REPOSITORY")
          if [[ -n "$TARGET_RUN" ]]; then
            [[ "$TARGET_RUN" =~ ^[1-9][0-9]*$ ]] || exit 1
            args+=(--run-id "$TARGET_RUN")
          else
            args+=(--sweep)
          fi
          # Publish first, without deleting any tracking refs. Even a partial
          # sweep emits a JSON array containing successes and failures.
          result_file="$RUNNER_TEMP/factory-checkpoint-result.json"
          handoff_status=0
          python3 .github/scripts/factory_checkpoint_handoff.py "${args[@]}" > "$result_file" || handoff_status=$?
          jq -e 'type == "array" and all(.[]; type == "object" and has("run_id"))' "$result_file" > /dev/null || {
            echo "::error::Checkpoint publication did not produce a complete JSON result"
            exit 1
          }
          # Receipts MUST be committed to Neon before ref retirement. No DSN
          # is a hard error here, not a false "recorded 0" success.
          python3 .github/scripts/factory_state_ledger.py checkpoint-receipts \
            --repo "$GITHUB_REPOSITORY" --run-id "${TARGET_RUN:-0}" \
            --file "$result_file"
          if (( handoff_status == 0 )); then
            # Cleanup is now a separate, retriable post-receipt pass. Only the
            # verified, unclaimed refs the controller proves incorporated can
            # be retired. A failed cleanup does not erase the durable receipt.
            python3 .github/scripts/factory_checkpoint_handoff.py "${args[@]}" --cleanup \
              > "$RUNNER_TEMP/factory-checkpoint-cleanup.json" || handoff_status=$?
          fi
          {
            echo '### Checkpoint recovery'
            echo '```json'
            cat "$result_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$handoff_status"
      - name: Reconcile older missing terminal outcomes in a bounded scheduled pass
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ -n "${FACTORY_STATE_DSN_FILE:-}" && -f "$FACTORY_STATE_DSN_FILE" ]] || {
            echo "::error::Neon ledger unavailable for terminal recovery"
            exit 1
          }
          python3 .github/scripts/factory_outcome_reconcile.py \
            --repo "$GITHUB_REPOSITORY" --hours 24 --limit 20 --max-pages 4 \
            | tee "$RUNNER_TEMP/factory-terminal-reconciliation.json"
          {
            echo '### Missing terminal outcome recovery'
            echo '```json'
            cat "$RUNNER_TEMP/factory-terminal-reconciliation.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
