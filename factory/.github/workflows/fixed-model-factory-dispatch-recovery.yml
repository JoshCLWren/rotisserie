name: Fixed Model Factory Dispatcher Recovery

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fixed-model-factory-dispatch-recovery.yml'
      - '.github/scripts/factory_heartbeat_health.py'
      - '.github/scripts/factory_runtime_view.py'
      - '.github/factory-expected-workers.json'

permissions:
  actions: write
  contents: read

concurrency:
  group: fixed-model-factory-dispatch-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Configure shared Neon factory discovery cache
        uses: ./.github/actions/factory-state-cache
        with:
          neon-api-key: ${{ secrets.NEON_API_KEY }}
          neon-project-id: ${{ vars.NEON_PROJECT_ID }}

      - name: Recover stale fixed-model dispatcher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          # Neon is the durable, trusted runtime view.
          report="$RUNNER_TEMP/factory-heartbeat-report.md"
          refresh_health() {
            python3 -c 'import json, sys; sys.path.insert(0, ".github/scripts"); from factory_runtime_view import export_view; print(json.dumps(export_view(sys.argv[1])))' "$GITHUB_REPOSITORY" \
              > /tmp/factory-runtime-view.json
            python3 .github/scripts/factory_heartbeat_health.py \
              --view /tmp/factory-runtime-view.json \
              --output /tmp/factory-heartbeat-health.json \
              --summary "$report"
          }
          : > "$report"
          refresh_health
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

          # Lifecycle freshness comes only from trusted Neon events written by
          # the run workflow's own trusted jobs. Issue #1093 is retired as a
          # registry: there is no GitHub comment fallback to reconcile.
          # Per-worker freshness is diagnostic only. Preserve the existing
          # fleet-wide recovery gate; never launch a worker for its stale age.
          newest_age="$(jq -r '.newest_active_age_seconds // "missing"' /tmp/factory-heartbeat-health.json)"
          if [[ "$newest_age" != missing ]] && (( newest_age < 1200 )); then
            echo 'An active factory heartbeat is fresh; no dispatcher recovery needed.'
            exit 0
          fi

          echo 'Fixed-model heartbeats are stale; dispatching recovery run.'
          gh workflow run fixed-model-factory-dispatch.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f mode=roster
          echo 'Recovery dispatcher requested.'

      - name: Preserve per-worker heartbeat diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: factory-heartbeat-health
          path: /tmp/factory-heartbeat-health.json
          if-no-files-found: warn
