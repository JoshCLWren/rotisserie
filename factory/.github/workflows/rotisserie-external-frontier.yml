# Installed by factory/install/install.py in an adopter repository.
# Read-only GitHub-native work discovery; this workflow never grants claims.
name: Rotisserie External Work Frontier
run-name: Rotisserie next work · ${{ github.actor }}
on:
  workflow_dispatch:

env:
  FACTORY_REPO_VARS: >-
    {"FACTORY_SLOTS_PER_PROVIDER": "${{ vars.FACTORY_SLOTS_PER_PROVIDER }}", "FACTORY_PR_WIP_LIMIT": "${{ vars.FACTORY_PR_WIP_LIMIT }}", "FACTORY_REVIEW_BACKLOG_LIMIT": "${{ vars.FACTORY_REVIEW_BACKLOG_LIMIT }}", "FACTORY_OMNIROUTE_FREE_ENTRY_CAP": "${{ vars.FACTORY_OMNIROUTE_FREE_ENTRY_CAP }}", "FACTORY_NO_DIFF_RETRY_LIMIT": "${{ vars.FACTORY_NO_DIFF_RETRY_LIMIT }}", "FACTORY_NO_DIFF_RETRY_RESET_SECONDS": "${{ vars.FACTORY_NO_DIFF_RETRY_RESET_SECONDS }}", "FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS": "${{ vars.FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS }}", "FACTORY_FIXED_LEASE_TTL_SECONDS": "${{ vars.FACTORY_FIXED_LEASE_TTL_SECONDS }}", "FACTORY_LOCAL_LEASE_TTL_SECONDS": "${{ vars.FACTORY_LOCAL_LEASE_TTL_SECONDS }}", "FACTORY_PRIORITY_ORDER": "${{ vars.FACTORY_PRIORITY_ORDER }}"}

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: rotisserie-external-frontier
  queue: max
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out adopter
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      # The installer inserts the pinned Rotisserie checkout and overlays the
      # existing factory modules after the adopter checkout. This command
      # installs from that exact pinned local tree, never from an unpinned branch.
      - name: Install Python and uv
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v7

      - name: Configure shared Neon observation
        uses: ./.github/actions/factory-state-cache
        with:
          neon-api-key: ${{ secrets.NEON_API_KEY }}
          neon-project-id: ${{ vars.NEON_PROJECT_ID }}

      - name: Read controller-ranked frontier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test -f .rotisserie/runtime/pyproject.toml
          uv tool run --from ./.rotisserie/runtime rotisserie factory \
            next --repo "$GITHUB_REPOSITORY" --json > "$RUNNER_TEMP/frontier.json"
          python3 - "$RUNNER_TEMP/frontier.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          snapshot = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          rows = [
              "# Rotisserie next meaningful work",
              "",
              "Observation only. **No work is reserved.** A trusted fenced claim is required.",
              "",
              f"Snapshot: `{snapshot['generated_at']}`",
              f"Expires: `{snapshot['expires_at']}`",
              "",
              "| Rank | Target | Action | State |",
              "| ---: | --- | --- | --- |",
          ]
          for offer in snapshot["offers"][:25]:
              fields = [str(offer[key]) for key in ("rank", "target", "action", "status")]
              fields = [field.replace("|", "\\|").replace("\n", " ")[:100] for field in fields]
              rows.append("| " + " | ".join(fields) + " |")
          if not snapshot["authoritative_claim_available"]:
              rows.extend(["", "**Neon unavailable: all offers held.**"])
          rows.extend(["", "Download the JSON artifact for hold details, capacity and provenance."])
          Path(sys.argv[2]).write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY

      - name: Publish short-lived machine-readable frontier
        uses: actions/upload-artifact@v4
        with:
          name: rotisserie-work-frontier-${{ github.run_id }}
          path: ${{ runner.temp }}/frontier.json
          retention-days: 1
          if-no-files-found: error
