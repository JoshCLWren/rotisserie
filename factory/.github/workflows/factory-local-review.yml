name: Attest Actual Local Factory Reviews
on:
  workflow_dispatch:
    inputs:
      evidence:
        description: JSON containing exact head, actual local reports, completion metadata and original reviewer acceptance
        required: true
        type: string
env:
  # Operator settings (rotisserie factory settings) reach every factory script.
  FACTORY_REPO_VARS: >-
    {"FACTORY_SLOTS_PER_PROVIDER": "${{ vars.FACTORY_SLOTS_PER_PROVIDER }}", "FACTORY_PR_WIP_LIMIT": "${{ vars.FACTORY_PR_WIP_LIMIT }}", "FACTORY_REVIEW_BACKLOG_LIMIT": "${{ vars.FACTORY_REVIEW_BACKLOG_LIMIT }}", "FACTORY_OMNIROUTE_FREE_ENTRY_CAP": "${{ vars.FACTORY_OMNIROUTE_FREE_ENTRY_CAP }}", "FACTORY_NO_DIFF_RETRY_LIMIT": "${{ vars.FACTORY_NO_DIFF_RETRY_LIMIT }}", "FACTORY_NO_DIFF_RETRY_RESET_SECONDS": "${{ vars.FACTORY_NO_DIFF_RETRY_RESET_SECONDS }}", "FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS": "${{ vars.FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS }}", "FACTORY_FIXED_LEASE_TTL_SECONDS": "${{ vars.FACTORY_FIXED_LEASE_TTL_SECONDS }}", "FACTORY_LOCAL_LEASE_TTL_SECONDS": "${{ vars.FACTORY_LOCAL_LEASE_TTL_SECONDS }}", "FACTORY_PRIORITY_ORDER": "${{ vars.FACTORY_PRIORITY_ORDER }}"}

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write
jobs:
  attest:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Validate original evidence and attest as trusted controller
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_REVIEW_EVIDENCE: ${{ inputs.evidence }}
        run: python3 .github/scripts/factory_local_review.py
      - name: Reconcile canonical gates and wake merge drain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/factory-review-controller.py reconcile-ci
          gh workflow run factory-ready-merge-drain.yml --ref main
