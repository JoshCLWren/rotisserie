name: Fixed free-model factory runner

on:
  workflow_call:
    inputs:
      assignment:
        description: Bounded dispatcher assignment with target, exact head and claim token
        required: true
        type: string
      worker:
        description: Durable factory executor slot
        required: true
        type: string
    secrets:
      NEON_API_KEY:
        description: Restricted connection resolution in trusted cleanup jobs only
        required: false
      OPENCODE_API_KEY:
        required: false
      OPENCODE_ZEN_API_KEY:
        required: false
      NVIDIA_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      Z_AI_API_KEY:
        required: false
      OLLAMA_API_KEY:
        required: false
      MISTRAL_API_KEY:
        required: false
      ORCAROUTER_API_KEY:
        required: false
      REQUESTY_API_KEY:
        required: false
      POLLINATIONS_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      GROQ_API_KEY:
        required: false
      AION_API_KEY:
        required: false
      COHERE_API_KEY:
        required: false
      TYPHOON_API_KEY:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      AI_GATEWAY_API_KEY:
        required: false
      OMNIROUTE_API_KEY:
        required: false
      OMNIROUTE_MANAGEMENT_API_KEY:
        required: false
      PR_REBASE_TOKEN:
        required: true
      FACTORY_READER_APP_ID:
        description: Optional read-only factory App (separate API quota bucket)
        required: false
      FACTORY_READER_APP_PRIVATE_KEY:
        required: false
      # Worker 48 only. Missing secrets keep that worker on PR_REBASE_TOKEN.
      # These values do not create the GitHub App.
      FACTORY_WORKER_48_APP_ID:
        required: false
      FACTORY_WORKER_48_INSTALLATION_ID:
        required: false
      FACTORY_WORKER_48_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: fixed-model-factory-${{ inputs.worker }}
  cancel-in-progress: false

env:
  FACTORY_BUDGET_SECONDS: '6000'
  KILO_VERSION: '7.4.22'
  KILO_LINUX_X64_BASELINE_SHA256: 'bf817ad53bc95b16abe92e7a2389cc9f509c62c3510c23ecc58e151a4455cb41'

jobs:
  validate_assignment:
    name: Validate assignment under worker lock (trusted)
    outputs:
      exclusions: ${{ steps.prepare.outputs.exclusions }}
      candidate_health: ${{ steps.prepare.outputs.candidate_health }}
      fleet_sources: ${{ steps.prepare.outputs.fleet_sources }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/factory-state-cache
        with:
          neon-api-key: ${{ secrets.NEON_API_KEY }}
          neon-project-id: ${{ vars.NEON_PROJECT_ID }}
      - name: Verify original active claim and live target
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_ASSIGNMENT: ${{ inputs.assignment }}
          FACTORY_WORKER: ${{ inputs.worker }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$FACTORY_ASSIGNMENT" | python3 .github/scripts/factory-work-controller.py validate-assignment --worker "$FACTORY_WORKER" >/dev/null
          snapshot="$(python3 .github/scripts/factory_state_operations.py export-model-exclusions --repo "$GITHUB_REPOSITORY" --worker "$FACTORY_WORKER")"
          jq -e 'type == "object"' <<< "$snapshot" >/dev/null
          echo "exclusions=$snapshot" >> "$GITHUB_OUTPUT"
          candidate_health="$(python3 .github/scripts/factory_state_operations.py export-candidate-health --repo "$GITHUB_REPOSITORY")"
          jq -e '.models | type == "array"' <<< "$candidate_health" >/dev/null
          echo "candidate_health=$candidate_health" >> "$GITHUB_OUTPUT"
          fleet_sources="$(python3 .github/scripts/factory_state_operations.py export-fleet-failover-sources --repo "$GITHUB_REPOSITORY" --worker "$FACTORY_WORKER")"
          jq -e 'type == "array" and all(.[]; type == "string")' <<< "$fleet_sources" >/dev/null
          echo "fleet_sources=$fleet_sources" >> "$GITHUB_OUTPUT"
      # Trusted lifecycle evidence lives in Neon, keyed by this Entry run.
      # It replaces the retired issue #1093 heartbeat comments; the model job
      # never receives the DSN and no GitHub comment is read or written.
      - name: Record trusted worker start in Neon
        continue-on-error: true
        env:
          FACTORY_WORKER: ${{ inputs.worker }}
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/factory_state_ledger.py lifecycle \
            --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --worker "$FACTORY_WORKER" --status started \
            || echo '::warning::FACTORY_LIFECYCLE_DEFERRED status=started; terminal outcome still persists from the job log'

  factory:
    needs: validate_assignment
    runs-on: ubuntu-latest
    # Allow the agent a full budget plus setup and handoff time.
    timeout-minutes: 120
    outputs:
      worker_session_started: ${{ steps.worker_session.outputs.started }}
    env:
      FACTORY_MODEL_EXCLUSIONS: ${{ needs.validate_assignment.outputs.exclusions }}
      FACTORY_CANDIDATE_HEALTH: ${{ needs.validate_assignment.outputs.candidate_health }}
      FACTORY_FLEET_SOURCES: ${{ needs.validate_assignment.outputs.fleet_sources }}
      # Workflow token handles GitHub API, labels, comments, and backlog-zero
      # workflow dispatch. Git fetch/push and PR creation use the dedicated
      # PAT so pull_request workflows and initial review use a trusted actor.
      GH_TOKEN: ${{ github.token }}
      PR_REBASE_TOKEN: ${{ secrets.PR_REBASE_TOKEN }}
      # Worker 48 installation token inputs. Empty unless Josh has created the App.
      FACTORY_WORKER_48_APP_ID: ${{ secrets.FACTORY_WORKER_48_APP_ID }}
      FACTORY_WORKER_48_INSTALLATION_ID: ${{ secrets.FACTORY_WORKER_48_INSTALLATION_ID }}
      FACTORY_WORKER_48_APP_PRIVATE_KEY: ${{ secrets.FACTORY_WORKER_48_APP_PRIVATE_KEY }}
      FACTORY_READER_APP_ID: ${{ secrets.FACTORY_READER_APP_ID }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY || secrets.OPENCODE_ZEN_API_KEY }}
      Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
      REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AION_API_KEY: ${{ secrets.AION_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      TYPHOON_API_KEY: ${{ secrets.TYPHOON_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      OMNIROUTE_MANAGEMENT_API_KEY: ${{ secrets.OMNIROUTE_MANAGEMENT_API_KEY }}
      OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL }}
      # INCIDENT 2026-09-06: OmniRoute stays off; multi-provider Entry is live.
      FACTORY_OMNIROUTE_ENABLED: ${{ vars.FACTORY_OMNIROUTE_ENABLED || 'off' }}
    steps:
      - name: Require trusted push credential
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${PR_REBASE_TOKEN:-}" ]]; then
            echo '::error::PR_REBASE_TOKEN is required so fixed-model factory pushes trigger PR workflows without action_required.'
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.PR_REBASE_TOKEN }}

      - name: Install factory syntax parsers
        uses: ./.github/actions/factory-syntax

      - name: Configure trusted git remote
        shell: bash
        run: |
          set -Eeuo pipefail
          # Shared producer for every worker. Worker 48 replaces this remote
          # in free-model-factory-worker-primitives.sh only when its
          # installation token is configured. Other workers never do.
          git remote set-url origin "https://x-access-token:${PR_REBASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Resolve executor slot policy
        id: lane
        shell: bash
        env:
          REQUESTED_WORKER: ${{ inputs.worker }}
        run: |
          set -Eeuo pipefail
          slot="$(python3 .github/scripts/factory_worker_slots.py resolve --worker "$REQUESTED_WORKER")"
          worker="$(jq -er '.worker' <<< "$slot")"
          source="$(jq -er '.source' <<< "$slot")"
          minute="$(jq -er '.minute' <<< "$slot")"
          scheduler="$(jq -er '.scheduler' <<< "$slot")"
          display="$(jq -er '.display_name' <<< "$slot")"
          model=''
          runtime_model=''
          deepseek_mode=normal
          branch_suffix="$source"
          configure_adapter=false
          case "$source" in
            opencode-free|openrouter-free|kilo-auto)
              configured=true
              reason='catalog-discovery-at-execution'
              ;;
            omniroute-free)
              if [[ "${FACTORY_OMNIROUTE_ENABLED:-off}" =~ ^(1|on|true|yes)$ ]] &&
                 [[ -n "${OMNIROUTE_API_KEY:-}" && -n "${OMNIROUTE_BASE_URL:-}" ]]; then
                configured=true
                reason='configured-omniroute'
              else
                configured=false
                reason='omniroute-unconfigured'
              fi
              ;;
            *)
              # The integration registry checks credentials without any model ID.
              resolution="$(python3 .github/scripts/factory_provider_registry.py credentials --source "$source")"
              configured="$(jq -er '.configured | tostring' <<< "$resolution")"
              reason="$(jq -er '.reason' <<< "$resolution")"
              configure_adapter="$(jq -er '.configure_adapter | tostring' <<< "$resolution")"
              ;;
          esac
          {
            echo "deepseek_mode=$deepseek_mode"
            echo "worker=$worker"
            echo "source=$source"
            echo "model=$model"
            echo "runtime_model=$runtime_model"
            echo "minute=$minute"
            echo "scheduler=$scheduler"
            echo "display=$display"
            echo "branch_suffix=$branch_suffix"
            echo "configure_adapter=$configure_adapter"
            echo "configured=$configured"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          printf 'Factory %s assigned dynamic provider slot: source=%s configured=%s\n' \
            "$worker" "$source" "$configured"

      - name: Configure git identity
        env:
          WORKER: ${{ steps.lane.outputs.worker }}
        run: |
          git config user.name "opencode-free-model-factory-${WORKER}[bot]"
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Ensure durable owner label
        shell: bash
        env:
          WORKER: ${{ steps.lane.outputs.worker }}

        run: |
          set -Eeuo pipefail
          label="factory:${WORKER}"
          description="Factory ${WORKER}: code and review executor slot"
          if gh api "repos/${GITHUB_REPOSITORY}/labels/factory%3A${WORKER}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/labels/factory%3A${WORKER}" \
              -f name="$label" -f color='5319e7' -f description="$description" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
              -f name="$label" -f color='5319e7' -f description="$description" >/dev/null
          fi

      - name: Stop cleanly when optional credentials are not configured
        if: steps.lane.outputs.configured != 'true'
        shell: bash
        env:
          REASON: ${{ steps.lane.outputs.reason }}
          DISPLAY: ${{ steps.lane.outputs.display }}
        run: |
          echo "${DISPLAY} lane is installed but inactive: ${REASON}"

      - name: Install current OpenCode 2
        if: steps.lane.outputs.configured == 'true'
        run: bash .github/scripts/install-opencode-v2.sh

      - name: Install pinned Kilo CLI release
        if: steps.lane.outputs.configured == 'true' && steps.lane.outputs.source == 'kilo-auto'
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/kilo-linux-x64-baseline.tar.gz"
          bin_dir="$RUNNER_TEMP/kilo-bin"
          curl -fsSL \
            "https://github.com/Kilo-Org/kilocode/releases/download/v${KILO_VERSION}/kilo-linux-x64-baseline.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$KILO_LINUX_X64_BASELINE_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir"
          kilo_path="$(find "$bin_dir" -type f -name kilo -perm -111 | head -n 1)"
          [[ -n "$kilo_path" ]] || { echo 'Pinned Kilo archive did not contain an executable kilo binary' >&2; exit 1; }
          if [[ "$kilo_path" != "$bin_dir/kilo" ]]; then ln -s "$kilo_path" "$bin_dir/kilo"; fi
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/kilo" --version

      - name: Select execution candidate at dispatch time
        id: executor
        if: steps.lane.outputs.configured == 'true'
        shell: bash
        env:
          WORKER: ${{ steps.lane.outputs.worker }}
          SOURCE: ${{ steps.lane.outputs.source }}
          LANE_MODEL: ${{ steps.lane.outputs.model }}
          LANE_RUNTIME_MODEL: ${{ steps.lane.outputs.runtime_model }}
          DEEPSEEK_MODE: ${{ steps.lane.outputs.deepseek_mode }}
          LANE_DISPLAY: ${{ steps.lane.outputs.display }}
          LANE_BRANCH_SUFFIX: ${{ steps.lane.outputs.branch_suffix }}
        run: |
          set -Eeuo pipefail
          discovery_outcome="$RUNNER_TEMP/factory-discovery-outcome"
          exclusions_file="$RUNNER_TEMP/factory-neon-model-exclusions.json"
          printf '%s\n' "$FACTORY_MODEL_EXCLUSIONS" > "$exclusions_file"
          printf '%s\n' "$FACTORY_FLEET_SOURCES" > "$RUNNER_TEMP/factory-fleet-sources.json"
          jq -e 'type == "object" and all(.[]; type == "array")' "$exclusions_file" >/dev/null || {
            printf 'control_plane_failure\tTrusted Neon model snapshot unavailable\n' > "$discovery_outcome"
            exit 1
          }
          # A lane whose own catalog is fully cooling, unreadable or empty
          # must not fail the dispatch. Select the next eligible pair across
          # the trusted Neon fleet admission instead, exactly as the worker
          # does after a failed attempt, and log the trusted transition.
          fleet_fallback() {
            local reason="$1" fallback
            if fallback="$(python3 .github/scripts/factory_model_failover.py \
                --source "$SOURCE" --worker "$WORKER" \
                --rotation "${GITHUB_RUN_NUMBER:-0}" \
                --exclusions-file "$exclusions_file" \
                --eligible-sources-file "$RUNNER_TEMP/factory-fleet-sources.json" \
                --fleet-catalog-cache "$RUNNER_TEMP/factory-fleet-catalogs.json" \
                --blocked-provider "$SOURCE")"; then
              echo "Factory $WORKER lane $SOURCE: $reason; selecting across the eligible fleet"
              selection="$fallback"
              return 0
            fi
            printf 'provider_failure\t%s; no eligible fleet candidate\n' "$reason" > "$discovery_outcome"
            exit 1
          }
          selection=''
          # Selection happens after the relevant CLI is installed. Nothing
          # uses a checked-in model ID, cost limit, or worker/model mapping.
          case "$SOURCE" in
            kilo-auto)
              catalog="$RUNNER_TEMP/factory-kilo-catalog"
              if kilo models kilo --refresh > "$catalog"; then
                selection="$(python3 .github/scripts/factory_kilo_catalog.py \
                  --catalog "$catalog" --worker "$WORKER" \
                  --exclusions-file "$exclusions_file")" \
                  || fleet_fallback 'Kilo catalog has no eligible candidate'
              else
                fleet_fallback 'Kilo CLI catalog unavailable'
              fi
              ;;
            opencode-free)
              catalog="$RUNNER_TEMP/factory-opencode-free-catalog"
              if bash scripts/opencode-model-catalog.sh opencode verbose refresh > "$catalog"; then
                comments_file="$RUNNER_TEMP/factory-opencode-attempt-comments.json"
                printf '[]\n' > "$comments_file"
                selection="$(python3 .github/scripts/factory_live_opencode.py \
                  --catalog "$catalog" --worker "$WORKER" --comments "$comments_file" \
                  --exclusions-file "$exclusions_file" --rotation "${GITHUB_RUN_NUMBER:-0}")" \
                  || fleet_fallback 'OpenCode catalog has no eligible candidate'
              else
                fleet_fallback 'OpenCode live catalog unavailable'
              fi
              ;;
            openrouter-free|vercel-ai-gateway)
              selection="$(python3 .github/scripts/factory_published_model_catalog.py \
                --source "$SOURCE" --worker "$WORKER" \
                --exclusions-file "$exclusions_file")" \
                || fleet_fallback 'published catalog has no eligible candidate'
              ;;
            omniroute-free)
              catalog="$RUNNER_TEMP/factory-omniroute-catalog.json"
              curl --silent --show-error --fail-with-body \
                --connect-timeout 5 --max-time 30 --retry 5 --retry-all-errors --retry-delay 5 \
                --header "Authorization: Bearer ${OMNIROUTE_API_KEY}" \
                "${OMNIROUTE_BASE_URL%/}/models" > "$catalog" || {
                printf 'provider_failure\tOmniRoute catalog unavailable\n' > "$discovery_outcome"
                exit 1
              }
              selection="$(python3 .github/scripts/factory_runtime_model_select.py \
                --source "$SOURCE" --worker "$WORKER" --catalog-json "$catalog" \
                --exclusions-file "$exclusions_file")"
              ;;
            *)
              selection="$(python3 .github/scripts/factory_runtime_model_select.py \
                --source "$SOURCE" --worker "$WORKER" \
                --exclusions-file "$exclusions_file")" \
                || fleet_fallback 'provider catalog has no eligible candidate'
              ;;
          esac

          selected_source="$(jq -r '.source // empty' <<< "$selection")"
          selected_source="${selected_source:-$SOURCE}"
          # Prefer an eligible model whose last real outcome proved coding
          # work on this lane's provider. Advisory: any failure keeps the
          # lane's own pick, and cooled models stay excluded either way.
          if [[ "$selected_source" == "$SOURCE" ]]; then
            proven_args=(--source "$SOURCE" --worker "$WORKER" --proven-only
              --rotation "${GITHUB_RUN_NUMBER:-0}" --exclusions-file "$exclusions_file")
            case "$SOURCE" in
              opencode-free|kilo-auto) proven_args+=(--catalog-file "${catalog:-/nonexistent}") ;;
              *) proven_args+=(--catalog-cache "$RUNNER_TEMP/factory-proven-catalog.json") ;;
            esac
            if proven="$(python3 .github/scripts/factory_model_failover.py "${proven_args[@]}" 2>/dev/null)"; then
              selection="$proven"
              echo "Factory $WORKER prefers proven $(jq -r '.model' <<< "$selection") on $SOURCE"
            fi
          fi
          model="$(jq -er '.model' <<< "$selection")"
          runtime_model="$(jq -er '.runtime_model' <<< "$selection")"
          configure_adapter="$(python3 - "$selected_source" <<'PY'
          import sys
          sys.path.insert(0, ".github/scripts")
          from factory_provider_registry import PROVIDERS
          print("true" if sys.argv[1] in PROVIDERS else "false")
          PY
          )"
          if [[ "$selected_source" != "$SOURCE" ]]; then
            # Same trusted marker the worker emits on an in-lease switch; the
            # outcome projector only accepts a final source it can attest.
            echo "[factory:$WORKER][source:$selected_source][model:$model] FACTORY_FLEET_TRANSITION: source=$selected_source model=$model runtime=$runtime_model target=dispatch"
          fi
          {
            echo "source=$selected_source"
            echo "configure_adapter=$configure_adapter"
            echo "model=$model"
            echo "runtime_model=$runtime_model"
            echo "display=$selected_source · $model"
            echo "branch_suffix=$LANE_BRANCH_SUFFIX"
            echo "reason=selected-from-live-runtime-catalog"
          } >> "$GITHUB_OUTPUT"
          echo "Factory $WORKER discovered $runtime_model; real work verifies callability"

      # Crouton's OpenCode Zen free route can reject anonymous runner requests.
      # Do not change the anonymous DeepSeek comparison or other model lanes.
      - name: Configure selected OmniRoute capacity
        if: vars.FACTORY_OMNIROUTE_ENABLED == 'on' && steps.lane.outputs.configured == 'true' && (steps.executor.outputs.source || steps.lane.outputs.source) == 'omniroute-free'
        shell: bash
        env:
          MODEL: ${{ steps.executor.outputs.model || steps.lane.outputs.model }}
        run: |
          set -Eeuo pipefail
          [[ -n "${OMNIROUTE_API_KEY:-}" ]] || { echo 'OMNIROUTE_API_KEY missing for selected OmniRoute capacity' >&2; exit 1; }
          [[ -n "${OMNIROUTE_BASE_URL:-}" ]] || { echo 'OMNIROUTE_BASE_URL missing for selected OmniRoute capacity' >&2; exit 1; }

          mkdir -p "$HOME/.config/opencode"
          temp_config="$(mktemp)"
          jq -n \
            --arg model "$MODEL" \
            --arg key "$OMNIROUTE_API_KEY" \
            --arg base_url "${OMNIROUTE_BASE_URL%/}" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg job "$GITHUB_JOB" \
            --arg workflow "$GITHUB_WORKFLOW" \
            '{
              providers: {
                omniroute: {
                  name: "OmniRoute free capacity",
                  package: "@opencode/ai/providers/openai-compatible",
                  env: ["OMNIROUTE_API_KEY"],
                  settings: {baseURL: $base_url},
                  headers: {
                    "X-GitHub-Run-ID": $run_id,
                    "X-GitHub-Job": $job,
                    "X-GitHub-Workflow": $workflow
                  },
                  models: {($model): {name: $model}}
                }
              }
            }' > "$temp_config"
          # Retain the installer's noninteractive permission and safety policy.
          jq -s '.[0] * .[1]' "$HOME/.config/opencode/opencode.json" "$temp_config" > "$temp_config.merged"
          mv "$temp_config.merged" "$HOME/.config/opencode/opencode.json"
          rm -f "$temp_config"
          chmod 600 "$HOME/.config/opencode/opencode.json"

      - name: Configure OpenAI-compatible factory provider
        if: steps.lane.outputs.configured == 'true' && (steps.executor.outputs.configure_adapter || steps.lane.outputs.configure_adapter) == 'true'
        shell: bash
        env:
          SOURCE: ${{ steps.executor.outputs.source || steps.lane.outputs.source }}
          MODEL: ${{ steps.executor.outputs.model || steps.lane.outputs.model }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.config/opencode"
          temp_config="$(mktemp)"
          trap 'rm -f "$temp_config" "$temp_config.merged"' EXIT
          # The registry owns the OpenCode ID, endpoint, key name, and exact
          # upstream modelID. The output contains no secret values.
          python3 .github/scripts/factory_provider_registry.py config \
            --source "$SOURCE" --model "$MODEL" > "$temp_config"
          jq -s '.[0] * .[1]' "$HOME/.config/opencode/opencode.json" "$temp_config" > "$temp_config.merged"
          mv "$temp_config.merged" "$HOME/.config/opencode/opencode.json"
          chmod 600 "$HOME/.config/opencode/opencode.json"

      # Catalog membership is advisory. A missing or exhausted initial model
      # must not abort the assigned worker before the fleet-wide failover loop.
      # Its first real coding call establishes actual inference availability.
      # The first model invocation is the real leased coding/review mission.
      # Catalog and free-price checks do not spend inference tokens.
      # No extra smoke, chat-completion probe, or tool-canary prompt.

      # Optional read-only factory App (owner-provisioned secrets
      # FACTORY_READER_APP_ID / FACTORY_READER_APP_PRIVATE_KEY). Pure reads
      # then spend that App's own 5000/h installation bucket instead of the
      # repository's shared GITHUB_TOKEN budget. Writes keep the workflow
      # token, so no extra workflows are ever triggered. Absent or
      # under-permissioned Apps are a silent no-op.
      # Resolve the existing App's client ID from authenticated GitHub metadata.
      - name: Resolve existing read-only App client ID
        id: read_app_identity
        if: ${{ env.FACTORY_READER_APP_ID != '' }}
        continue-on-error: true
        shell: bash
        env:
          FACTORY_APP_ID: ${{ secrets.FACTORY_READER_APP_ID }}
          FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_READER_APP_PRIVATE_KEY }}
        run: python3 .github/scripts/factory_app_client_id.py
      - name: Mint optional read-only factory App token
        id: read_token
        if: ${{ steps.read_app_identity.outputs.client_id != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ steps.read_app_identity.outputs.client_id }}
          private-key: ${{ secrets.FACTORY_READER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Verify and enable read-only factory App token
        if: ${{ steps.read_token.outputs.token != '' }}
        continue-on-error: true
        shell: bash
        env:
          READ_TOKEN: ${{ steps.read_token.outputs.token }}
        run: |
          set -Eeuo pipefail
          minted="$(date +%s)"
          for endpoint in "issues?per_page=1" "pulls?per_page=1" "actions/runs?per_page=1" \
            "commits/main/check-runs?per_page=1"; do
            if ! GH_TOKEN="$READ_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/${endpoint}" >/dev/null 2>&1; then
              echo "::warning::Read-only factory App cannot read ${endpoint%%\?*}; staying on the workflow token"
              exit 0
            fi
          done
          {
            echo "FACTORY_READ_TOKEN=$READ_TOKEN"
            echo "FACTORY_READ_TOKEN_EXPIRES=$((minted + 3000))"
          } >> "$GITHUB_ENV"
          echo "Pure GitHub reads use the read-only factory App installation budget"

      - name: Run continuous fixed-model factory session
        id: worker_session
        if: steps.lane.outputs.configured == 'true'
        env:
          FACTORY_OMNIROUTE_ENABLED: ${{ vars.FACTORY_OMNIROUTE_ENABLED || 'off' }}
          FACTORY_ASSIGNMENT: ${{ inputs.assignment }}
          FACTORY_WORKER: ${{ steps.lane.outputs.worker }}
          FACTORY_SOURCE: ${{ steps.executor.outputs.source || steps.lane.outputs.source }}
          FACTORY_MODEL: ${{ steps.executor.outputs.model || steps.lane.outputs.model }}
          FACTORY_RUNTIME_MODEL: ${{ steps.executor.outputs.runtime_model || steps.lane.outputs.runtime_model }}
          FACTORY_DISPLAY: ${{ steps.executor.outputs.display || steps.lane.outputs.display }}
          FACTORY_BRANCH_SUFFIX: ${{ steps.executor.outputs.branch_suffix || steps.lane.outputs.branch_suffix }}
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          # Telemetry only: count this session's gh requests (wrapper and
          # agent) against the shared installation REST budget.
          meter_dir="$(mktemp -d "$RUNNER_TEMP/factory-gh-meter.XXXXXX")"
          cp .github/scripts/factory-gh-meter.sh "$meter_dir/gh"
          chmod +x "$meter_dir/gh"
          # Run the reporter from this trusted copy, not the PR checkout.
          cp .github/scripts/factory_gh_usage.py "$meter_dir/factory_gh_usage.py"
          FACTORY_REAL_GH="$(command -v gh)"
          export FACTORY_REAL_GH FACTORY_GH_CALL_LOG="$RUNNER_TEMP/factory-gh-calls.log"
          export PATH="$meter_dir:$PATH"
          # Hosted VMs have been shut down mid-session, losing the step log.
          # Push resource snapshots to a hidden ref so the cause survives.
          cp .github/scripts/factory-vm-sampler.sh "$meter_dir/factory-vm-sampler.sh"
          setsid bash "$meter_dir/factory-vm-sampler.sh" "$GITHUB_RUN_ID" 15 \
            </dev/null >/dev/null 2>&1 &
          vm_sampler_pid=$!
          set +e
          bash .github/scripts/free-model-factory-worker.sh
          worker_status=$?
          kill -USR1 "$vm_sampler_pid" 2>/dev/null
          wait "$vm_sampler_pid" 2>/dev/null
          python3 -I "$meter_dir/factory_gh_usage.py" "$FACTORY_GH_CALL_LOG" \
            --label "worker ${FACTORY_WORKER}" --summary "$GITHUB_STEP_SUMMARY"
          set -e
          # Write after the worker (and model) exits, so attempt code cannot
          # forge the trusted wrapper's source classification.
          printf '%s\n' "$worker_status" > "$RUNNER_TEMP/factory-worker-status"
          exit "$worker_status"

      - name: Report OmniRoute routing summary
        if: always() && vars.FACTORY_OMNIROUTE_ENABLED == 'on' && steps.lane.outputs.configured == 'true' && (steps.executor.outputs.source || steps.lane.outputs.source) == 'omniroute-free'
        shell: bash
        env:
          MODEL: ${{ steps.executor.outputs.model || steps.lane.outputs.model }}
        run: |
          set -Eeuo pipefail
          [[ -n "${OMNIROUTE_MANAGEMENT_API_KEY:-}" && -n "${OMNIROUTE_BASE_URL:-}" ]] || {
            echo 'OmniRoute routing summary unavailable: gateway credentials missing' >&2
            exit 0
          }
          gateway_base_url="${OMNIROUTE_BASE_URL%/}"
          case "$gateway_base_url" in
            */v1) gateway_base_url="${gateway_base_url%/v1}" ;;
          esac
          analytics="$RUNNER_TEMP/omniroute-analytics.json"
          code="$(curl --silent --show-error --output "$analytics" --write-out '%{http_code}' \
            --connect-timeout 5 --max-time 30 \
            --header "Authorization: Bearer ${OMNIROUTE_MANAGEMENT_API_KEY}" \
            "${gateway_base_url}/api/usage/analytics?period=session" || true)"
          if [[ "$code" != 200 ]]; then
            message="OmniRoute routing summary unavailable (HTTP ${code})"
            echo "::warning::$message"
            echo "$message" >&2
            {
              echo '### OmniRoute routing summary'
              echo
              echo "> ⚠️ ${message}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          summary="$(jq -r '.summary | "requests=\(.totalRequests) successful=\(.successfulRequests) success_rate_pct=\(.successRatePct) avg_latency_ms=\(.avgLatencyMs)"' "$analytics")"
          echo "OmniRoute routing summary (session-wide): ${summary}"
          {
            echo '### OmniRoute routing summary'
            echo
            echo "Requested model: ${MODEL}"
            echo
            echo '```text'
            echo "$summary"
            jq -r '.byModel[] | "provider=\(.provider) model=\(.model) requests=\(.requests) success_rate_pct=\(.successRatePct) avg_latency_ms=\(.avgLatencyMs)"' "$analytics"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize factory attempt
        if: always()
        shell: bash
        env:
          WORKER: ${{ steps.lane.outputs.worker }}
          MODEL: ${{ steps.executor.outputs.model || steps.lane.outputs.model }}
          SOURCE: ${{ steps.executor.outputs.source || steps.lane.outputs.source }}
          CONFIGURED: ${{ steps.lane.outputs.configured }}
          REASON: ${{ steps.executor.outputs.reason || steps.lane.outputs.reason }}
          JOB_STATUS: ${{ job.status }}
          WORKER_STATUS_FILE: ${{ runner.temp }}/factory-worker-status
          DISCOVERY_OUTCOME_FILE: ${{ runner.temp }}/factory-discovery-outcome
        # Visibility only, written to the job summary (not the classified job
        # log). The trusted Entry persister classifies the job log into Neon;
        # issue #1093 is retired as a registry and is never written.
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          [[ -n "${WORKER:-}" ]] || exit 0
          worker_status="$(cat "$WORKER_STATUS_FILE" 2>/dev/null || true)"
          discovery_record="$(cat "$DISCOVERY_OUTCOME_FILE" 2>/dev/null || true)"
          if [[ -n "$discovery_record" ]]; then
            IFS="$(printf '\t')" read -r attempt_outcome attempt_detail <<< "$discovery_record"
          elif [[ "$worker_status" == 2 || "$worker_status" == 3 ]]; then
            attempt_outcome='control_plane_failure'
            attempt_detail="factory controller assignment failed with exit status ${worker_status}"
          elif [[ "$CONFIGURED" == true && "$JOB_STATUS" == success ]]; then
            attempt_outcome='classification_pending'
            attempt_detail='wrapper exited; awaiting trusted work/delivery classification'
          elif [[ "$CONFIGURED" != true ]]; then
            attempt_outcome='unknown_failure'
            attempt_detail="factory lane was not executable: ${REASON}"
          else
            attempt_outcome='unknown_failure'
            attempt_detail='factory job failed before a more specific log classification was available'
          fi
          {
            echo "### Factory ${WORKER} attempt"
            echo
          # Markdown backticks in this printf format are intentional.
          # shellcheck disable=SC2016
            printf -- '- Source/model: `%s` / `%s`\n' "$SOURCE" "$MODEL"
          # Markdown backticks in this printf format are intentional.
          # shellcheck disable=SC2016
            printf -- '- Job status: `%s`\n' "$JOB_STATUS"
          # Markdown backticks in this printf format are intentional.
          # shellcheck disable=SC2016
            printf -- '- Provisional attempt outcome: `%s`\n' "$attempt_outcome"
            printf -- '- Detail: %s\n' "$attempt_detail"
            echo
            echo 'The trusted Entry persister classifies the job log into Neon.'
          } >> "$GITHUB_STEP_SUMMARY"

  release_pre_session_lease:
    needs: factory
    if: ${{ always() && needs.factory.outputs.worker_session_started != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # A failed smoke may have modified its checkout. Recover from a fresh
      # trusted main on a separate runner, inside the same per-worker lock.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/factory-syntax
      # Only this trusted, separate cleanup job receives the Neon DSN.
      # The model-running factory job above must never see it.
      - name: Configure restricted Neon factory lease release
        uses: ./.github/actions/factory-state-cache
        with:
          neon-api-key: ${{ secrets.NEON_API_KEY }}
          neon-project-id: ${{ vars.NEON_PROJECT_ID }}
      - name: Release lease after pre-session abort
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_WORKER: ${{ inputs.worker }}
          FACTORY_ASSIGNMENT: ${{ inputs.assignment }}
        run: |
          set -Eeuo pipefail
          [[ "$FACTORY_WORKER" =~ ^[1-9][0-9]*$ ]] || {
            echo 'Invalid worker ID; refusing lease recovery' >&2
            exit 1
          }
          # Never clear GitHub ownership without the transactional Neon ledger.
          [[ -s "${FACTORY_STATE_DSN_FILE:-}" ]] || {
            echo 'Neon factory lease connection missing; refusing split release' >&2
            exit 1
          }
          python3 .github/scripts/factory_worker_slots.py resolve --worker "$FACTORY_WORKER" >/dev/null
          claim_id="$(jq -er '.claim_id | select(type == "string" and length > 0)' <<< "$FACTORY_ASSIGNMENT")"
          python3 .github/scripts/factory-work-controller.py release \
            --worker "$FACTORY_WORKER" --claim-id "$claim_id" --reason "pre-session-abort-run-${GITHUB_RUN_ID}"
      - name: Record trusted worker exit in Neon
        if: always()
        continue-on-error: true
        env:
          FACTORY_WORKER: ${{ inputs.worker }}
          FACTORY_RESULT: ${{ needs.factory.result }}
        run: |
          set -Eeuo pipefail
          status=failure
          [[ "$FACTORY_RESULT" == success ]] && status=finished
          python3 .github/scripts/factory_state_ledger.py lifecycle \
            --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --worker "$FACTORY_WORKER" --status "$status" \
            || echo "::warning::FACTORY_LIFECYCLE_DEFERRED status=$status"

  release_post_session_lease:
    needs: factory
    # Keep the worker lock until both execution and trusted release complete.
    if: ${{ always() && needs.factory.outputs.worker_session_started == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Separate trusted runner; never use the model's checkout or credentials.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/factory-syntax
      - name: Configure restricted Neon post-session lease release
        uses: ./.github/actions/factory-state-cache
        with:
          neon-api-key: ${{ secrets.NEON_API_KEY }}
          neon-project-id: ${{ vars.NEON_PROJECT_ID }}
      - name: Release worker lease after session exits
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_WORKER: ${{ inputs.worker }}
          FACTORY_ASSIGNMENT: ${{ inputs.assignment }}
        run: |
          set -Eeuo pipefail
          [[ "$FACTORY_WORKER" =~ ^[1-9][0-9]*$ ]] || {
            echo 'Invalid worker ID; refusing lease recovery' >&2
            exit 1
          }
          [[ -s "${FACTORY_STATE_DSN_FILE:-}" ]] || {
            echo 'Neon factory lease connection missing; refusing split release' >&2
            exit 1
          }
          python3 .github/scripts/factory_worker_slots.py resolve --worker "$FACTORY_WORKER" >/dev/null
          claim_id="$(jq -er '.claim_id | select(type == "string" and length > 0)' <<< "$FACTORY_ASSIGNMENT")"
          python3 .github/scripts/factory-work-controller.py release \
            --worker "$FACTORY_WORKER" --claim-id "$claim_id" --reason "post-session-exit-run-${GITHUB_RUN_ID}"
      - name: Record trusted worker exit in Neon
        if: always()
        continue-on-error: true
        env:
          FACTORY_WORKER: ${{ inputs.worker }}
          FACTORY_RESULT: ${{ needs.factory.result }}
        run: |
          set -Eeuo pipefail
          status=failure
          [[ "$FACTORY_RESULT" == success ]] && status=finished
          python3 .github/scripts/factory_state_ledger.py lifecycle \
            --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --worker "$FACTORY_WORKER" --status "$status" \
            || echo "::warning::FACTORY_LIFECYCLE_DEFERRED status=$status"

