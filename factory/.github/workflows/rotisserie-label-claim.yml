# Installed into adopter by factory/install/install.py. Trusted label claims -> shared Neon (#191).
# Every trigger here runs the default-branch workflow file, never a PR's copy.
name: Rotisserie Label Claim Controller
run-name: Label claim · ${{ github.event_name }} · ${{ github.actor }}
on:
  issues:
    types: [labeled, unlabeled]
  pull_request_target:
    types: [labeled, unlabeled, opened, ready_for_review, edited, synchronize]
  issue_comment:
    types: [created]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Label doctor mode
        type: choice
        options: [dry-run, repair, delete-legacy]
        default: dry-run

permissions:
  contents: read
  # Claim answers (labels, one status comment) and verified hand-offs: the
  # same writes the external claim bridge makes. This job runs no PR code.
  issues: write
  pull-requests: write
  # Factory label writes start no workflow, so the next stage is dispatched.
  actions: write
  checks: read
  statuses: read

env:
  FACTORY_REPO_VARS: >-
    {"FACTORY_SLOTS_PER_PROVIDER": "${{ vars.FACTORY_SLOTS_PER_PROVIDER }}", "FACTORY_PR_WIP_LIMIT": "${{ vars.FACTORY_PR_WIP_LIMIT }}", "FACTORY_REVIEW_BACKLOG_LIMIT": "${{ vars.FACTORY_REVIEW_BACKLOG_LIMIT }}", "FACTORY_OMNIROUTE_FREE_ENTRY_CAP": "${{ vars.FACTORY_OMNIROUTE_FREE_ENTRY_CAP }}", "FACTORY_NO_DIFF_RETRY_LIMIT": "${{ vars.FACTORY_NO_DIFF_RETRY_LIMIT }}", "FACTORY_NO_DIFF_RETRY_RESET_SECONDS": "${{ vars.FACTORY_NO_DIFF_RETRY_RESET_SECONDS }}", "FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS": "${{ vars.FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS }}", "FACTORY_FIXED_LEASE_TTL_SECONDS": "${{ vars.FACTORY_FIXED_LEASE_TTL_SECONDS }}", "FACTORY_LOCAL_LEASE_TTL_SECONDS": "${{ vars.FACTORY_LOCAL_LEASE_TTL_SECONDS }}", "FACTORY_PRIORITY_ORDER": "${{ vars.FACTORY_PRIORITY_ORDER }}"}

concurrency:
  group: rotisserie-label-claim-${{ github.event.issue.number || github.event.pull_request.number || 'doctor' }}
  cancel-in-progress: false

jobs:
  claim:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.sender.type != 'Bot' &&
       (github.event_name != 'pull_request_target' ||
        github.event.pull_request.head.repo.full_name == github.repository) &&
       (((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
         github.event.label.name == 'factory:claimed') ||
        (github.event_name == 'issue_comment' &&
         contains(github.event.issue.labels.*.name, 'factory:claimed')) ||
        (github.event_name == 'pull_request_target' &&
         github.event.action == 'synchronize' &&
         contains(github.event.pull_request.labels.*.name, 'factory:claimed')) ||
        (github.event_name == 'pull_request_target' &&
         contains(fromJSON('["opened","ready_for_review","edited"]'), github.event.action) &&
         !github.event.pull_request.draft)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse reruns and impersonated triggers
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$TRIGGERING_ACTOR" == "$GITHUB_ACTOR" ]]

      - name: Check out adopter
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      # Installer inserts the pinned Rotisserie checkout and overlay here.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7

      # The doctor must still run when Neon is down: it then withholds every
      # factory:available and touches no claim. Claim events need Neon.
      - name: Configure shared restricted Neon authority
        continue-on-error: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        uses: ./.github/actions/factory-state-cache
        with:
          neon-api-key: ${{ secrets.NEON_API_KEY }}
          neon-project-id: ${{ vars.NEON_PROJECT_ID }}

      - name: Answer the claim event or run the label doctor
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        run: |
          set -Eeuo pipefail
          test -f .rotisserie/runtime/pyproject.toml
          rotisserie=(uv tool run --with 'asyncpg>=0.30,<1' --from ./.rotisserie/runtime rotisserie)
          case "$GITHUB_EVENT_NAME" in
            schedule) args=(factory labels --repair) ;;
            workflow_dispatch)
              case "$MODE" in
                repair) args=(factory labels --repair) ;;
                delete-legacy) args=(factory labels --repair --delete-legacy) ;;
                *) args=(factory labels) ;;
              esac ;;
            *)
              test -s "${FACTORY_STATE_DSN_FILE:-}"
              args=(factory label-event --event-path "$GITHUB_EVENT_PATH") ;;
          esac
          "${rotisserie[@]}" "${args[@]}" --repo "$GITHUB_REPOSITORY" --json \
            > "$RUNNER_TEMP/label-claim.json"
          handed=$(jq -r 'if .operation == "handoff" and .status == "released" then "yes" else "no" end' \
            "$RUNNER_TEMP/label-claim.json" 2>/dev/null || echo no)
          echo "handed_off=$handed" >> "$GITHUB_OUTPUT"
          jq -r '"Status: \(.status // .mode // "unknown")  Reason: \(.reason // "none")"' \
            "$RUNNER_TEMP/label-claim.json" >> "$GITHUB_STEP_SUMMARY" || true

      # An outside review hand-off leaves the PR in factory:ci; promote it
      # through the canonical gates exactly as the local review attestation does.
      - name: Let factory scripts read outside-agent claims
        if: steps.run.outputs.handed_off == 'yes'
        run: python3 -m pip install --quiet --disable-pip-version-check 'asyncpg>=0.30,<1'

      - name: Reconcile canonical gates and wake merge drain
        if: steps.run.outputs.handed_off == 'yes'
        env:
          FACTORY_NEON_CONFIGURED: ${{ vars.NEON_PROJECT_ID != '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/factory-review-controller.py reconcile-ci
          gh workflow run factory-ready-merge-drain.yml --ref main

      - name: Publish bounded result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rotisserie-label-claim-${{ github.run_id }}
          path: ${{ runner.temp }}/label-claim.json
          retention-days: 1
          if-no-files-found: warn
