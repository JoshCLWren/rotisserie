name: Factory Issue Wakeup

on:
  issues:
    types: [opened, reopened, edited, labeled, unlabeled]

env:
  # Operator settings (rotisserie factory settings) reach every factory script.
  FACTORY_REPO_VARS: >-
    {"FACTORY_SLOTS_PER_PROVIDER": "${{ vars.FACTORY_SLOTS_PER_PROVIDER }}", "FACTORY_PR_WIP_LIMIT": "${{ vars.FACTORY_PR_WIP_LIMIT }}", "FACTORY_REVIEW_BACKLOG_LIMIT": "${{ vars.FACTORY_REVIEW_BACKLOG_LIMIT }}", "FACTORY_OMNIROUTE_FREE_ENTRY_CAP": "${{ vars.FACTORY_OMNIROUTE_FREE_ENTRY_CAP }}", "FACTORY_NO_DIFF_RETRY_LIMIT": "${{ vars.FACTORY_NO_DIFF_RETRY_LIMIT }}", "FACTORY_NO_DIFF_RETRY_RESET_SECONDS": "${{ vars.FACTORY_NO_DIFF_RETRY_RESET_SECONDS }}", "FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS": "${{ vars.FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS }}", "FACTORY_FIXED_LEASE_TTL_SECONDS": "${{ vars.FACTORY_FIXED_LEASE_TTL_SECONDS }}", "FACTORY_LOCAL_LEASE_TTL_SECONDS": "${{ vars.FACTORY_LOCAL_LEASE_TTL_SECONDS }}", "FACTORY_PRIORITY_ORDER": "${{ vars.FACTORY_PRIORITY_ORDER }}"}

permissions:
  actions: write
  contents: read

concurrency:
  group: factory-issue-wakeup-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  wake:
    # Claim labels belong to the label claim controller; waking a factory
    # worker on them would race the agent that asked for the item.
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'factory:unowned') &&
      !contains(github.event.issue.labels.*.name, 'factory:claimed') &&
      !contains(fromJSON('["factory:available","factory:claimed","factory:claim-rejected"]'), github.event.label.name)
    runs-on: ubuntu-latest
    steps:
      - name: Offer changed issue to trusted dispatcher
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -Eeuo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          gh workflow run fixed-model-factory-dispatch.yml \
            --repo "$GITHUB_REPOSITORY" --ref main \
            -f target="issue:$ISSUE_NUMBER" -f action=advance
