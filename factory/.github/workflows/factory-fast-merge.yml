name: Factory-only Fast Merge

# Privileged automation runs only trusted main. Merge only after unprivileged
# CI reports successful tests, lint and syntax gates for the exact PR head.
# An owner-authorized token must have a ruleset bypass for protected main.
# The policy switch lives in .github/factory-fast-merge.json.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
  # A trusted default-branch workflow observes completed, unprivileged PR CI.
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Optional PR number, otherwise scan open PRs'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  issues: write

concurrency:
  group: factory-only-fast-merge
  cancel-in-progress: false
  queue: max

jobs:
  fast-merge:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    # Always execute trusted main and recheck exact-head CI before merge.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Merge only factory PRs with exact-head green Python checks
        id: merge
        shell: bash
        env:
          # Repo ruleset MUST authorize this credential for PR-only bypass.
          # The script applies the strict factory-only allowlist and leases.
          GH_TOKEN: ${{ secrets.PR_REBASE_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr || '' }}
        run: |
          set -Eeuo pipefail
          # Never let a completed CI run without a PR sweep the entire queue.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" && -z "$PR_NUMBER" ]]; then
            echo "::notice::Completed CI run has no associated PR; skipping"
            echo 'merged_count=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args=(--repo "$GITHUB_REPOSITORY")
          if [[ -n "$PR_NUMBER" ]]; then
            args+=(--pr "$PR_NUMBER")
          fi
          python3 .github/scripts/factory-fast-merge.py "${args[@]}" > "$RUNNER_TEMP/fast-merge-result.json"
          cat "$RUNNER_TEMP/fast-merge-result.json"
          count="$(jq -r '.merged | length' "$RUNNER_TEMP/fast-merge-result.json")"
          echo "merged_count=$count" >> "$GITHUB_OUTPUT"

      - name: Reconcile merged issues and dispatch production
        if: steps.merge.outputs.merged_count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/factory_post_merge_closure.py --sweep || {
            echo "::warning::Post-merge sweep failed; existing drain can retry"
          }
          # The trusted Python merge path already dispatched production in finally.
