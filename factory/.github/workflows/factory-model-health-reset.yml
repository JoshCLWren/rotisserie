name: Factory Model Health Reset
on:
  workflow_dispatch:
    inputs:
      include_retired:
        description: Also clear retired HTTP 410 model records
        type: boolean
        default: false
        required: false
env:
  # Operator settings (rotisserie factory settings) reach every factory script.
  FACTORY_REPO_VARS: >-
    {"FACTORY_SLOTS_PER_PROVIDER": "${{ vars.FACTORY_SLOTS_PER_PROVIDER }}", "FACTORY_PR_WIP_LIMIT": "${{ vars.FACTORY_PR_WIP_LIMIT }}", "FACTORY_REVIEW_BACKLOG_LIMIT": "${{ vars.FACTORY_REVIEW_BACKLOG_LIMIT }}", "FACTORY_OMNIROUTE_FREE_ENTRY_CAP": "${{ vars.FACTORY_OMNIROUTE_FREE_ENTRY_CAP }}", "FACTORY_NO_DIFF_RETRY_LIMIT": "${{ vars.FACTORY_NO_DIFF_RETRY_LIMIT }}", "FACTORY_NO_DIFF_RETRY_RESET_SECONDS": "${{ vars.FACTORY_NO_DIFF_RETRY_RESET_SECONDS }}", "FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS": "${{ vars.FACTORY_REVIEW_FAILURE_COOLDOWN_SECONDS }}", "FACTORY_FIXED_LEASE_TTL_SECONDS": "${{ vars.FACTORY_FIXED_LEASE_TTL_SECONDS }}", "FACTORY_LOCAL_LEASE_TTL_SECONDS": "${{ vars.FACTORY_LOCAL_LEASE_TTL_SECONDS }}", "FACTORY_PRIORITY_ORDER": "${{ vars.FACTORY_PRIORITY_ORDER }}"}

permissions:
  contents: read
concurrency:
  group: factory-model-health-reset
  cancel-in-progress: false
jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Connect restricted factory state database
        uses: ./.github/actions/factory-state-cache
        with:
          neon-api-key: ${{ secrets.NEON_API_KEY }}
          neon-project-id: ${{ vars.NEON_PROJECT_ID }}
      - name: Clear learned model and provider cooldowns
        shell: bash
        env:
          INCLUDE_RETIRED: ${{ inputs.include_retired }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${FACTORY_STATE_DSN_FILE:-}" ]]; then
            echo "::error::Neon factory state connection is required for reset"
            exit 1
          fi
          args=(reset-model-health --repo "$GITHUB_REPOSITORY")
          if [[ "$INCLUDE_RETIRED" == "true" ]]; then
            args+=(--include-retired)
          fi
          python3 .github/scripts/factory_state_operations.py "${args[@]}" | tee "$GITHUB_STEP_SUMMARY"
