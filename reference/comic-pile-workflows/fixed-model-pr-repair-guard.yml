name: Fixed Model PR Repair Guard

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: fixed-model-pr-repair-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python .github/scripts/fixed-model-guard.py --self-test
