name: Main Health Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  checks: read

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Detect red main from CI check-runs
        id: health
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sha="$(git rev-parse HEAD)"
          echo "Checking main health at $sha"

          runs_file="$RUNNER_TEMP/main-ci-workflow-runs.json"
          if ! gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&event=push&per_page=100" \
            > "$runs_file"; then
            echo "GitHub API unavailable proving product CI health at ${sha}" >&2
            echo "failing=1" >> "$GITHUB_OUTPUT"
            echo "total=0" >> "$GITHUB_OUTPUT"
            echo "names=api-unavailable" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! health="$(python3 .github/scripts/factory_main_health.py --sha "$sha" < "$runs_file")"; then
            echo "GitHub returned invalid product CI health data at ${sha}" >&2
            echo "failing=1" >> "$GITHUB_OUTPUT"
            echo "total=0" >> "$GITHUB_OUTPUT"
            echo "names=invalid-api-response" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          total="$(jq -r '.total' <<< "$health")"
          failing="$(jq -r '.failing' <<< "$health")"
          failing_names="$(jq -r '.failing_names' <<< "$health")"
          echo "Main health API result: sha=${sha} total_count=${total} failing=${failing}"

          # Factory-token merges do not always emit a push CI run. Exact-head
          # PR gates remain authoritative, so absent product CI is not red.
          if [[ "${total:-0}" == "0" ]]; then
            echo "No push-triggered product CI runs reported for $sha; no red signal exists"
            echo "failing=0" >> "$GITHUB_OUTPUT"
            echo "total=0" >> "$GITHUB_OUTPUT"
            echo "names=" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "total=$total failing=$failing names=$failing_names"
          echo "failing=$failing" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "names=$failing_names" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Ensure main-breakage label exists
        if: steps.health.outputs.failing != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/labels/main-breakage" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" -f name="main-breakage" -f color="B60205" -f description="Main is red - factory blocked until base is green" >/dev/null || true
          fi

      - name: Open or refresh main-breakage P0
        if: steps.health.outputs.failing != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILING: ${{ steps.health.outputs.failing }}
          NAMES: ${{ steps.health.outputs.names }}
          SHA: ${{ steps.health.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          title="Main is red at ${SHA:0:12} - factory blocked"
          body="Main commit ${SHA} has ${FAILING} failing check(s): ${NAMES}.

          This issue was opened by Main Health Gate to block the factory from merging further PRs onto a broken base and to make the base fix the single highest-priority work.

          Next: fix main so CI on ${SHA} goes green. When green, this issue can be closed or will be auto-closed by the gate.
          "

          # Dedupe: if a main-breakage issue is already open, comment and refresh it instead of opening a duplicate.
          open_issue="$(gh issue list --state open --limit 100 --label "main-breakage" --json number,title --jq '.[0].number // empty')"
          if [[ -n "$open_issue" ]]; then
            echo "Found existing main-breakage #${open_issue}, refreshing"
            gh issue comment "$open_issue" --body "Main still red at ${SHA}: ${NAMES} (${FAILING} failing). See https://github.com/${GITHUB_REPOSITORY}/commit/${SHA}" >/dev/null || true
            exit 0
          fi

          echo "Opening main-breakage P0 for $SHA"
          gh issue create \
            --title "$title" \
            --body "$body" \
            --label "user-reported" \
            --label "bug" \
            --label "priority:P0" \
            --label "factory" \
            --label "factory:unowned" \
            --label "ralph-status:pending" \
            --label "main-breakage" >/dev/null

      - name: Auto-close main-breakage when main is green
        if: steps.health.outputs.failing == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.health.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          issues="$(gh issue list --state open --limit 100 --label "main-breakage" --json number --jq '.[].number')"
          if [[ -z "$issues" ]]; then
            echo "No open main-breakage to close; main is green at $SHA"
            exit 0
          fi
          while IFS= read -r num; do
            [[ -n "$num" ]] || continue
            echo "Main is green at $SHA, closing main-breakage #$num"
            gh issue close "$num" --reason completed --comment "Main is green at ${SHA} - closing main-breakage." >/dev/null || true
          done <<< "$issues"
